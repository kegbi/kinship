name: kinship

services:
  postgres:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinship}
      POSTGRES_USER: ${POSTGRES_USER:-kinship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: [
      "deno",
      "run",
      "--allow-env=DATABASE_URL,PGHOST,PGPORT,PGUSERNAME,PGUSER,PGDATABASE,PGPASSWORD,PGMAX,PGSSL,PGSSLNEGOTIATION,PGIDLE_TIMEOUT,PGCONNECT_TIMEOUT,PGMAX_LIFETIME,PGMAX_PIPELINE,PGBACKOFF,PGKEEP_ALIVE,PGPREPARE,PGDEBUG,PGFETCH_TYPES,PGPUBLICATIONS,PGAPPNAME,PGTARGETSESSIONATTRS,PGTARGET_SESSION_ATTRS",
      "--allow-net=postgres:5432",
      "--allow-read=/app/personal-crm-schema/v1,/app/personal-crm-schema/v2,/app/personal-crm-schema/v3,/app/personal-crm-schema/v4,/app/personal-crm-schema/v5,/app/personal-crm-schema/v6,/app/personal-crm-schema/v7,/app/personal-crm-schema/v8,/app/personal-crm-schema/v9,/app/personal-crm-schema/v10",
      "tools/migrations/main.ts",
    ]
    environment:
      PGDATABASE: ${POSTGRES_DB:-kinship}
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-kinship}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_MFA_ENCRYPTION_KEYSET: ${AUTH_MFA_ENCRYPTION_KEYSET:-}
      AUTH_MINIMUM_RESPONSE_MS: ${AUTH_MINIMUM_RESPONSE_MS:-250}
      AUTH_THROTTLE_SUBJECT_KEYSET: ${AUTH_THROTTLE_SUBJECT_KEYSET:-}
      INTEGRATIONS_ENCRYPTION_KEYSET: ${INTEGRATIONS_ENCRYPTION_KEYSET:-}
      INTEGRATIONS_DAV_ENABLED: ${INTEGRATIONS_DAV_ENABLED:-true}
      HOST: 0.0.0.0
      PGDATABASE: ${POSTGRES_DB:-kinship}
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-kinship}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_HOST: ${OBJECT_STORAGE_HOST:-}
      OBJECT_STORAGE_PORT: ${OBJECT_STORAGE_PORT:-9000}
      OBJECT_STORAGE_REQUEST_TIMEOUT_MS: ${OBJECT_STORAGE_REQUEST_TIMEOUT_MS:-30000}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_USE_SSL: ${OBJECT_STORAGE_USE_SSL:-true}
      PORT: "8000"
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://127.0.0.1:4321}
      SMTP_FROM: ${SMTP_FROM:-hello@kinship.local}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-plain}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "fetch('http://127.0.0.1:8000/api/v1/health').then(r=>{if(!r.ok)Deno.exit(1)})",
      ]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=16m

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: [
      "deno",
      "run",
      "--allow-env=APP_ENV,READABLE_STREAM,DATABASE_URL,PGHOST,PGPORT,PGUSERNAME,PGUSER,PGDATABASE,PGPASSWORD,PGMAX,PGSSL,PGSSLNEGOTIATION,PGIDLE_TIMEOUT,PGCONNECT_TIMEOUT,PGMAX_LIFETIME,PGMAX_PIPELINE,PGBACKOFF,PGKEEP_ALIVE,PGPREPARE,PGDEBUG,PGFETCH_TYPES,PGPUBLICATIONS,PGAPPNAME,PGTARGETSESSIONATTRS,PGTARGET_SESSION_ATTRS,WORKER_INSTANCE_ID,OBJECT_STORAGE_ACCESS_KEY,OBJECT_STORAGE_BUCKET,OBJECT_STORAGE_HOST,OBJECT_STORAGE_PORT,OBJECT_STORAGE_REQUEST_TIMEOUT_MS,OBJECT_STORAGE_SECRET_KEY,OBJECT_STORAGE_USE_SSL,PUBLIC_WEB_ORIGIN,SMTP_FROM,SMTP_HOST,SMTP_PASSWORD,SMTP_PORT,SMTP_SECURITY,SMTP_USERNAME",
      "--allow-net=postgres:5432,${OBJECT_STORAGE_HOST:-object-store}:${OBJECT_STORAGE_PORT:-9000},${SMTP_HOST:-mailpit}:${SMTP_PORT:-1025}",
      "apps/worker/main.ts",
    ]
    environment:
      APP_ENV: ${APP_ENV:-production}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_HOST: ${OBJECT_STORAGE_HOST:-}
      OBJECT_STORAGE_PORT: ${OBJECT_STORAGE_PORT:-9000}
      OBJECT_STORAGE_REQUEST_TIMEOUT_MS: ${OBJECT_STORAGE_REQUEST_TIMEOUT_MS:-30000}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_USE_SSL: ${OBJECT_STORAGE_USE_SSL:-true}
      PGDATABASE: ${POSTGRES_DB:-kinship}
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-kinship}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://127.0.0.1:4321}
      SMTP_FROM: ${SMTP_FROM:-hello@kinship.local}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-plain}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      WORKER_INSTANCE_ID: ${WORKER_INSTANCE_ID:-kinship-worker}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    restart: unless-stopped
    stop_grace_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: web
    environment:
      API_ORIGIN: http://api:8000
      HOST: 0.0.0.0
      PORT: "4321"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD",
        "node",
        "-e",
        "Promise.all([fetch('http://127.0.0.1:4321/auth/mfa'),fetch('http://api:8000/api/v1/health')]).then(r=>{if(r.some(x=>!x.ok))process.exit(1)}).catch(()=>process.exit(1))",
      ]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=16m

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: gateway
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8443}:8443"
    volumes:
      - type: bind
        source: ${GATEWAY_TLS_CERTIFICATE_PATH:-./.tls/gateway.crt}
        target: /run/secrets/gateway_tls_certificate
        read_only: true
      - type: bind
        source: ${GATEWAY_TLS_PRIVATE_KEY_PATH:-./.tls/gateway.key}
        target: /run/secrets/gateway_tls_private_key
        read_only: true
    healthcheck:
      test: [
        "CMD",
        "wget",
        "-q",
        "-O",
        "/dev/null",
        "http://127.0.0.1:8080/gateway-health",
      ]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /var/cache/nginx:size=16m

volumes:
  postgres-data:
