name: kinship

services:
  postgres:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinship}
      POSTGRES_USER: ${POSTGRES_USER:-kinship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: [
      "deno",
      "run",
      "--allow-env=DATABASE_URL,PGHOST,PGPORT,PGUSERNAME,PGUSER,PGDATABASE,PGPASSWORD,PGMAX,PGSSL,PGSSLNEGOTIATION,PGIDLE_TIMEOUT,PGCONNECT_TIMEOUT,PGMAX_LIFETIME,PGMAX_PIPELINE,PGBACKOFF,PGKEEP_ALIVE,PGPREPARE,PGDEBUG,PGFETCH_TYPES,PGPUBLICATIONS,PGAPPNAME,PGTARGETSESSIONATTRS,PGTARGET_SESSION_ATTRS",
      "--allow-net=postgres:5432",
      "--allow-read=/app/personal-crm-schema/v1/personal_crm_rewrite_schema_v3.sql",
      "tools/migrations/main.ts",
    ]
    environment:
      PGDATABASE: ${POSTGRES_DB:-kinship}
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-kinship}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "100"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp:size=32m

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PGDATABASE: ${POSTGRES_DB:-kinship}
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-kinship}
      PORT: "8000"
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://127.0.0.1:4321}
      SMTP_FROM: hello@kinship.local
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "fetch('http://127.0.0.1:8000/api/v1/health').then(r=>{if(!r.ok)Deno.exit(1)})",
      ]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=16m

volumes:
  postgres-data:
