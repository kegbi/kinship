name: kinship

services:
  postgres:
    image: postgres:18.7-alpine3.23@sha256:339a86bf416979bb4d3d2e30a1f9e096e7302564faff4151b804cf53463059d5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinship}
      POSTGRES_USER: ${POSTGRES_USER:-kinship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    # AUD-G4 (BEQ-15): tuned for the 2 GiB limit below and SSD storage. The
    # pools open at most 8 API, 8 worker, and 1 migration connections, so
    # 16 MB of work_mem per sort or hash stays far inside the limit. Slow
    # statements are logged without their bind values, which carry CRM data.
    # Preloading pg_stat_statements does not create the extension; an
    # operator creates it in the `postgres` maintenance database, never the
    # application database (docs/architecture/observability.md).
    command: [
      "postgres",
      "-c",
      "shared_buffers=512MB",
      "-c",
      "work_mem=16MB",
      "-c",
      "random_page_cost=1.1",
      "-c",
      "shared_preload_libraries=pg_stat_statements",
      "-c",
      "log_min_duration_statement=250ms",
      "-c",
      "log_parameter_max_length=0",
    ]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 10s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The entrypoint starts as root: it owns the data and socket directories,
    # walks an existing 0700 data directory, and then drops to `postgres`.
    cap_add: [CHOWN, DAC_READ_SEARCH, SETGID, SETUID]
    mem_limit: 2g
    pids_limit: 256
    # A parallel hash join's dynamic shared memory (about work_mem x 2 x 3
    # processes, 96 MB at 16 MB) lives in /dev/shm, which Docker otherwise
    # caps at 64 MB. It is charged to the 2 GiB limit only as it is used.
    shm_size: 256m

  # ADR 0008: the one step that connects as the bootstrap superuser. It
  # creates or corrects the migrator, API, and worker roles and the owners of
  # the narrow cross-workspace functions, gives the login roles their
  # passwords, and hands an existing schema to the migrator. Idempotent.
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: [
      "deno",
      "run",
      "--allow-env=DATABASE_URL,PGHOST,PGPORT,PGUSERNAME,PGUSER,PGDATABASE,PGPASSWORD,PGMAX,PGSSL,PGSSLNEGOTIATION,PGIDLE_TIMEOUT,PGCONNECT_TIMEOUT,PGMAX_LIFETIME,PGMAX_PIPELINE,PGBACKOFF,PGKEEP_ALIVE,PGPREPARE,PGDEBUG,PGFETCH_TYPES,PGPUBLICATIONS,PGAPPNAME,PGTARGETSESSIONATTRS,PGTARGET_SESSION_ATTRS,POSTGRES_APP_PASSWORD,POSTGRES_MIGRATOR_PASSWORD,POSTGRES_WORKER_PASSWORD",
      "--allow-net=postgres:5432",
      "tools/migrations/bootstrap.ts",
    ]
    environment:
      PGDATABASE: ${POSTGRES_DB:-kinship}
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-kinship}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?Set POSTGRES_WORKER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 128

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: [
      "deno",
      "run",
      "--allow-env=DATABASE_URL,PGHOST,PGPORT,PGUSERNAME,PGUSER,PGDATABASE,PGPASSWORD,PGMAX,PGSSL,PGSSLNEGOTIATION,PGIDLE_TIMEOUT,PGCONNECT_TIMEOUT,PGMAX_LIFETIME,PGMAX_PIPELINE,PGBACKOFF,PGKEEP_ALIVE,PGPREPARE,PGDEBUG,PGFETCH_TYPES,PGPUBLICATIONS,PGAPPNAME,PGTARGETSESSIONATTRS,PGTARGET_SESSION_ATTRS",
      "--allow-net=postgres:5432",
      "--allow-read=/app/personal-crm-schema/v1,/app/personal-crm-schema/v2,/app/personal-crm-schema/v3,/app/personal-crm-schema/v4,/app/personal-crm-schema/v5,/app/personal-crm-schema/v6,/app/personal-crm-schema/v7,/app/personal-crm-schema/v8,/app/personal-crm-schema/v9,/app/personal-crm-schema/v10,/app/personal-crm-schema/v11,/app/personal-crm-schema/v12,/app/personal-crm-schema/v13,/app/personal-crm-schema/v14,/app/personal-crm-schema/v15,/app/personal-crm-schema/v16",
      "tools/migrations/main.ts",
    ]
    # The schema owner, which runs only this job (ADR 0008).
    environment:
      PGDATABASE: ${POSTGRES_DB:-kinship}
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}
      PGPORT: "5432"
      PGUSER: kinship_migrator
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    read_only: true
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128

  api:
    networks:
      default:
        aliases: [kinship-private-api]
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_MFA_ENCRYPTION_KEYSET: ${AUTH_MFA_ENCRYPTION_KEYSET:-}
      AUTH_MINIMUM_RESPONSE_MS: ${AUTH_MINIMUM_RESPONSE_MS:-250}
      AUTH_SIGN_IN_DEVICE_KEYSET: ${AUTH_SIGN_IN_DEVICE_KEYSET:-}
      AUTH_THROTTLE_SUBJECT_KEYSET: ${AUTH_THROTTLE_SUBJECT_KEYSET:-}
      INTEGRATIONS_ENCRYPTION_KEYSET: ${INTEGRATIONS_ENCRYPTION_KEYSET:-}
      INTEGRATIONS_DAV_ENABLED: ${INTEGRATIONS_DAV_ENABLED:-true}
      HOST: 0.0.0.0
      # Not a superuser, NOBYPASSRLS: every tenant row it reads or writes is
      # bound by forced row-level security (ADR 0008).
      PGDATABASE: ${POSTGRES_DB:-kinship}
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      PGPORT: "5432"
      PGUSER: kinship_app
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_HOST: ${OBJECT_STORAGE_HOST:-}
      OBJECT_STORAGE_PORT: ${OBJECT_STORAGE_PORT:-9000}
      OBJECT_STORAGE_REQUEST_TIMEOUT_MS: ${OBJECT_STORAGE_REQUEST_TIMEOUT_MS:-30000}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_USE_SSL: ${OBJECT_STORAGE_USE_SSL:-true}
      PORT: "8000"
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://127.0.0.1:4321}
      SMTP_FROM: ${SMTP_FROM:-hello@kinship.local}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-plain}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "fetch('http://127.0.0.1:8000/api/v1/health').then(r=>{if(!r.ok)Deno.exit(1)})",
      ]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 256

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: [
      "deno",
      "run",
      "--allow-env=APP_ENV,DATABASE_URL,PGHOST,PGPORT,PGUSERNAME,PGUSER,PGDATABASE,PGPASSWORD,PGMAX,PGSSL,PGSSLNEGOTIATION,PGIDLE_TIMEOUT,PGCONNECT_TIMEOUT,PGMAX_LIFETIME,PGMAX_PIPELINE,PGBACKOFF,PGKEEP_ALIVE,PGPREPARE,PGDEBUG,PGFETCH_TYPES,PGPUBLICATIONS,PGAPPNAME,PGTARGETSESSIONATTRS,PGTARGET_SESSION_ATTRS,WORKER_INSTANCE_ID,OBJECT_STORAGE_ACCESS_KEY,OBJECT_STORAGE_BUCKET,OBJECT_STORAGE_HOST,OBJECT_STORAGE_PORT,OBJECT_STORAGE_REQUEST_TIMEOUT_MS,OBJECT_STORAGE_SECRET_KEY,OBJECT_STORAGE_USE_SSL,PUBLIC_WEB_ORIGIN,SMTP_FROM,SMTP_HOST,SMTP_PASSWORD,SMTP_PORT,SMTP_SECURITY,SMTP_USERNAME",
      "--ignore-env=AWS_LAMBDA_BENCHMARK_MODE,AWS_LAMBDA_NODEJS_NO_GLOBAL_AWSLAMBDA,AWS_SDK_JS_NODE_VERSION_SUPPORT_WARNING_DISABLED",
      "--allow-net=postgres:5432,${OBJECT_STORAGE_HOST:-object-store}:${OBJECT_STORAGE_PORT:-9000},${SMTP_HOST:-mailpit}:${SMTP_PORT:-1025}",
      "apps/worker/main.ts",
    ]
    environment:
      APP_ENV: ${APP_ENV:-production}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_HOST: ${OBJECT_STORAGE_HOST:-}
      OBJECT_STORAGE_PORT: ${OBJECT_STORAGE_PORT:-9000}
      OBJECT_STORAGE_REQUEST_TIMEOUT_MS: ${OBJECT_STORAGE_REQUEST_TIMEOUT_MS:-30000}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_USE_SSL: ${OBJECT_STORAGE_USE_SSL:-true}
      # Only the tables the worker's jobs need, NOBYPASSRLS (ADR 0008).
      PGDATABASE: ${POSTGRES_DB:-kinship}
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_WORKER_PASSWORD:?Set POSTGRES_WORKER_PASSWORD}
      PGPORT: "5432"
      PGUSER: kinship_worker
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://127.0.0.1:4321}
      SMTP_FROM: ${SMTP_FROM:-hello@kinship.local}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-plain}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      WORKER_INSTANCE_ID: ${WORKER_INSTANCE_ID:-kinship-worker}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    restart: unless-stopped
    stop_grace_period: 10s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 256

  web:
    networks:
      default:
        aliases: [kinship-private-web]
    build:
      context: .
      dockerfile: Dockerfile.web
      target: web
    environment:
      API_ORIGIN: http://api:8000
      HOST: 0.0.0.0
      PORT: "4321"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # ADR 0007: the renderer answers requests and reaches the private API.
      test: [
        "CMD",
        "node",
        "-e",
        "Promise.all([fetch('http://127.0.0.1:4321/favicon.svg'),fetch('http://api:8000/api/v1/health')]).then(r=>{if(r.some(x=>!x.ok))process.exit(1)}).catch(()=>process.exit(1))",
      ]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: gateway
    # ADR 0007: the gateway's health and startup do not depend on the
    # renderer, which serves only the two legal pages.
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8443}:8443"
    volumes:
      - type: bind
        source: ${GATEWAY_TLS_CERTIFICATE_PATH:-./.tls/gateway.crt}
        target: /run/secrets/gateway_tls_certificate
        read_only: true
      - type: bind
        source: ${GATEWAY_TLS_PRIVATE_KEY_PATH:-./.tls/gateway.key}
        target: /run/secrets/gateway_tls_private_key
        read_only: true
    healthcheck:
      test: [
        "CMD",
        "wget",
        "-q",
        "-O",
        "/dev/null",
        "http://127.0.0.1:8080/gateway-health",
      ]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /var/cache/nginx:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 64

volumes:
  postgres-data:
