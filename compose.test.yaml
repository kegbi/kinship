services:
  postgres:
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql
  api:
    environment:
      APP_ENV: test
      AUTH_MFA_ENCRYPTION_KEYSET: '{"activeKeyId":"test","keys":{"test":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}}'
      AUTH_MINIMUM_RESPONSE_MS: "100"
      AUTH_THROTTLE_SUBJECT_KEYSET: '{"activeVersion":1,"keys":{"v1":"UlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlI"}}'
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-kinship}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-attachments}
      OBJECT_STORAGE_HOST: object-store
      OBJECT_STORAGE_PORT: "9000"
      OBJECT_STORAGE_REQUEST_TIMEOUT_MS: ${OBJECT_STORAGE_REQUEST_TIMEOUT_MS:-30000}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-kinship-local-secret}
      OBJECT_STORAGE_USE_SSL: "false"
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN}
    depends_on:
      object-store:
        condition: service_healthy
    ports: !reset []
  worker:
    environment:
      APP_ENV: test
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-kinship}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-attachments}
      OBJECT_STORAGE_HOST: object-store
      OBJECT_STORAGE_PORT: "9000"
      OBJECT_STORAGE_REQUEST_TIMEOUT_MS: ${OBJECT_STORAGE_REQUEST_TIMEOUT_MS:-30000}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-kinship-local-secret}
      OBJECT_STORAGE_USE_SSL: "false"
    depends_on:
      object-store:
        condition: service_healthy
  gateway:
    ports: !override
      - "127.0.0.1::8443"
  mailpit:
    ports:
      - "127.0.0.1::8025"
  object-store:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-kinship}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-kinship-local-secret}
      MC_HOST_local: http://${OBJECT_STORAGE_ACCESS_KEY:-kinship}:${OBJECT_STORAGE_SECRET_KEY:-kinship-local-secret}@127.0.0.1:9000
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 10s

volumes:
  object-store-data:
  postgres-data:
