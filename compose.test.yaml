services:
  postgres:
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql
  api:
    environment:
      APP_ENV: test
      AUTH_MFA_ENCRYPTION_KEYSET: '{"activeKeyId":"test","keys":{"test":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}}'
      AUTH_MINIMUM_RESPONSE_MS: "100"
      AUTH_THROTTLE_SUBJECT_KEYSET: '{"activeVersion":1,"keys":{"v1":"UlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlI"}}'
      INTEGRATIONS_ENCRYPTION_KEYSET: '{"activeKeyId":"test","keys":{"test":"aWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWk"}}'
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-kinship}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-attachments}
      OBJECT_STORAGE_HOST: object-store
      OBJECT_STORAGE_PORT: "9000"
      OBJECT_STORAGE_REQUEST_TIMEOUT_MS: ${OBJECT_STORAGE_REQUEST_TIMEOUT_MS:-30000}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-kinship-local-secret}
      OBJECT_STORAGE_USE_SSL: "false"
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN}
    depends_on:
      mailpit:
        condition: service_healthy
      object-store:
        condition: service_healthy
    ports: !reset []
  worker:
    environment:
      APP_ENV: test
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-kinship}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-attachments}
      OBJECT_STORAGE_HOST: object-store
      OBJECT_STORAGE_PORT: "9000"
      OBJECT_STORAGE_REQUEST_TIMEOUT_MS: ${OBJECT_STORAGE_REQUEST_TIMEOUT_MS:-30000}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-kinship-local-secret}
      OBJECT_STORAGE_USE_SSL: "false"
    depends_on:
      object-store:
        condition: service_healthy
  gateway:
    ports: !override
      - "127.0.0.1::8443"
  mailpit:
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "100"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp:size=32m
    ports:
      - "127.0.0.1::8025"
  object-store:
    image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-kinship}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-kinship-local-secret}
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /data
    healthcheck:
      test: [
        "CMD",
        "curl",
        "--fail",
        "--silent",
        "http://127.0.0.1:9000/health",
      ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 10s

volumes:
  object-store-data:
  postgres-data:
