# Mailpit and RustFS are defined once in compose.support.yaml; this overlay
# publishes only the Mailpit API port on a Docker-assigned host port and keeps
# object storage in a disposable tmpfs.
include:
  - compose.support.yaml

services:
  postgres:
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql
  api:
    environment:
      APP_ENV: test
      AUTH_MFA_ENCRYPTION_KEYSET: '{"activeKeyId":"test","keys":{"test":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}}'
      AUTH_MINIMUM_RESPONSE_MS: "100"
      AUTH_THROTTLE_SUBJECT_KEYSET: '{"activeVersion":1,"keys":{"v1":"UlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlI"}}'
      INTEGRATIONS_ENCRYPTION_KEYSET: '{"activeKeyId":"test","keys":{"test":"aWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWk"}}'
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-kinship}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-attachments}
      OBJECT_STORAGE_HOST: object-store
      OBJECT_STORAGE_PORT: "9000"
      OBJECT_STORAGE_REQUEST_TIMEOUT_MS: ${OBJECT_STORAGE_REQUEST_TIMEOUT_MS:-30000}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-kinship-local-secret}
      OBJECT_STORAGE_USE_SSL: "false"
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN}
    depends_on:
      mailpit:
        condition: service_healthy
      object-store:
        condition: service_healthy
    ports: !reset []
  worker:
    environment:
      APP_ENV: test
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-kinship}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-attachments}
      OBJECT_STORAGE_HOST: object-store
      OBJECT_STORAGE_PORT: "9000"
      OBJECT_STORAGE_REQUEST_TIMEOUT_MS: ${OBJECT_STORAGE_REQUEST_TIMEOUT_MS:-30000}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-kinship-local-secret}
      OBJECT_STORAGE_USE_SSL: "false"
    depends_on:
      object-store:
        condition: service_healthy
  gateway:
    # `deno task test:e2e` chooses the host port before any container exists
    # (REL-040); every other consumer leaves it unset and Docker assigns one.
    ports: !override
      - "127.0.0.1:${E2E_GATEWAY_PORT:-}:8443"
  mailpit:
    ports:
      - "127.0.0.1::8025"
  object-store:
    tmpfs:
      # uid/gid 10001 is the pinned image's rustfs user; revisit on image bumps.
      - /data:uid=10001,gid=10001
