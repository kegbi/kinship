schemaVersion: 1
decisionStatus: accepted
defaultDeliveryStatus: planned
routeParameterSyntax: colon
sectionDeepLinkParameter: section

renderingStrategies:
  static:
    description: Built without request-specific data.
  static-shell-islands:
    description: Prerendered shell with authenticated data loaded by focused islands.
  on-demand:
    description: Server-rendered per request because protected state affects the first response.

defaultStates:
  public:
    - ready
    - not-found
  authenticated:
    - loading
    - ready
    - empty
    - error
    - forbidden
    - not-found

pages:
  - id: public.home
    path: /
    access: public
    rendering: static
    owner: web
    flowIds: []

  - id: public.features
    path: /features
    access: public
    rendering: static
    owner: web
    flowIds: []

  - id: legal.privacy
    path: /privacy
    access: public
    rendering: static
    owner: governance
    flowIds: [GOVERNANCE-001]

  - id: legal.terms
    path: /terms
    access: public
    rendering: static
    owner: governance
    flowIds: [GOVERNANCE-001]

  - id: auth.sign-in
    path: /auth/sign-in
    access: anonymous-or-authenticated
    rendering: static-shell-islands
    owner: identity
    flowIds: [AUTH-003]

  - id: auth.sign-up
    path: /auth/sign-up
    access: anonymous
    rendering: static-shell-islands
    owner: identity
    flowIds: [AUTH-001]

  - id: auth.verify-email
    path: /auth/verify-email
    access: anonymous-or-authenticated
    rendering: on-demand
    owner: identity
    flowIds: [AUTH-001]

  - id: auth.recover
    path: /auth/forgot-password
    access: anonymous
    rendering: static-shell-islands
    owner: identity
    flowIds: [AUTH-003]

  - id: auth.reset
    path: /auth/reset-password
    access: anonymous
    rendering: on-demand
    owner: identity
    flowIds: [AUTH-003]

  - id: auth.mfa
    path: /auth/mfa
    access: authentication-challenge
    rendering: on-demand
    owner: identity
    flowIds: [AUTH-003]

  - id: invitation.accept
    path: /invite/:token
    access: anonymous-or-authenticated
    rendering: on-demand
    owner: workspaces
    flowIds: [AUTH-002]

  - id: app.today
    path: /app
    access: active-member
    rendering: static-shell-islands
    owner: web
    readModel: today
    flowIds: [TODAY-001, PLANNING-001, PLANNING-002, INTERACTION-001]
    sections:
      - attention-queue
      - people-due-for-contact
      - upcoming
      - recently-viewed-people
      - favorite-notes
      - recent-activity
    localActions:
      - quick-capture
      - complete-task
      - open-person
      - open-person-section
      - open-all-tasks

  - id: people.index
    path: /app/people
    access: active-member
    rendering: static-shell-islands
    owner: people
    flowIds: [PEOPLE-002, PEOPLE-007]
    sections:
      - search
      - saved-filters
      - tags
      - active-people

  - id: people.archived
    path: /app/people/archived
    access: active-member
    rendering: static-shell-islands
    owner: people
    flowIds: [PEOPLE-002, PEOPLE-004]

  - id: people.create
    path: /app/people/new
    access: crm-write
    rendering: static-shell-islands
    owner: people
    flowIds: [PEOPLE-001]

  - id: people.profile
    path: /app/people/:personId
    access: active-member
    rendering: static-shell-islands
    owner: people
    readModel: person-profile
    flowIds:
      - PEOPLE-003
      - PEOPLE-004
      - PEOPLE-005
      - PEOPLE-006
      - PEOPLE-007
      - RELATIONSHIP-001
      - INTERACTION-001
      - INTERACTION-002
      - GOVERNANCE-002
      - PLANNING-001
      - PLANNING-002
      - FILES-001
      - GIFTS-001
      - JOURNAL-002
    sections:
      - identity-summary
      - important-dates
      - contact-methods
      - addresses
      - relationships
      - first-meeting
      - work
      - food-preferences
      - pets
      - life-events
      - notes
      - conversations
      - calls
      - activities
      - tasks
      - reminders
      - stay-in-touch
      - gifts
      - debts
      - documents
      - photos
      - audit-summary
    localActions:
      - edit-person
      - set-avatar
      - favorite
      - log-activity
      - log-call
      - log-conversation
      - add-note
      - add-life-event
      - add-task
      - add-reminder
      - attach-file
      - export-vcard
      - archive
      - restore
      - delete
    # JOURNAL-002: the life-events section's own states beyond the page's
    # authenticated defaults. `read-only` is an archived person's list without
    # controls; `editing`, `saving`, and `validation-error` belong to its one
    # editor, and `stale` is a save or removal refused for an old revision.
    sectionStates:
      life-events:
        - loading
        - ready
        - empty
        - error
        - forbidden
        - not-found
        - hidden
        - read-only
        - editing
        - saving
        - validation-error
        - stale
    separatePersonPages:
      - people.activity-report
      - people.audit

  - id: people.activity-report
    path: /app/people/:personId/activity-report
    access: active-member
    rendering: static-shell-islands
    owner: interactions
    flowIds: [INTERACTION-001]

  - id: people.audit
    path: /app/people/:personId/audit
    access: audit-read
    rendering: static-shell-islands
    owner: governance
    flowIds: [GOVERNANCE-002]

  - id: tasks.index
    path: /app/tasks
    access: active-member
    rendering: static-shell-islands
    owner: planning
    flowIds: [PLANNING-001]
    sections:
      - open
      - completed
      - cancelled
      - person-filter

  - id: journal.index
    path: /app/journal
    access: active-member
    rendering: static-shell-islands
    owner: journal
    flowIds: [JOURNAL-001]
    sections: [composer, chronological-timeline]

  - id: journal.item
    path: /app/journal/:journalItemId
    access: active-member
    rendering: static-shell-islands
    owner: journal
    flowIds: [JOURNAL-001]
    sections: [item-detail]

  - id: settings.index
    path: /app/settings
    access: active-member
    rendering: static-shell-islands
    owner: web
    flowIds: [AUTH-004, AUTH-005]
    sections:
      - settings-search
      - personal-settings
      - workspace-settings
      - data-management
      - developer-and-integrations
      - billing-when-enabled

  - id: settings.profile
    path: /app/settings/profile
    access: active-member
    rendering: static-shell-islands
    owner: identity
    flowIds: [AUTH-004, AUTH-005]
    sections:
      - identity
      - self-person-link
      - account-lifecycle

  - id: settings.preferences
    path: /app/settings/preferences
    access: active-member
    rendering: static-shell-islands
    owner: workspaces
    flowIds: [AUTH-004, PLANNING-003]
    sections:
      - locale-and-time-zone
      - regional-formats
      - reminder-delivery-time
      - display-and-density
    # PLANNING-003: the reminder-delivery controls share the preferences
    # form's states. `unverified-fallback` is the always-visible note that a
    # member without a verified address keeps in-app reminders.
    sectionStates:
      reminder-delivery-time:
        - loading
        - ready
        - error
        - saving
        - saved
        - validation-error
        - unverified-fallback

  - id: settings.security
    path: /app/settings/security
    access: active-member
    rendering: static-shell-islands
    owner: identity
    flowIds: [AUTH-003, AUTH-004]
    sections:
      - password
      - multi-factor-authentication
      - passkeys
      - recovery-codes
      - sessions

  - id: settings.workspace
    path: /app/settings/workspace
    access: workspace-admin
    rendering: static-shell-islands
    owner: workspaces
    flowIds: [WORKSPACE-001]
    sections:
      - workspace-identity
      - workspace-defaults

  - id: settings.members
    path: /app/settings/members
    access: workspace-admin
    rendering: static-shell-islands
    owner: workspaces
    flowIds: [AUTH-002, WORKSPACE-001]
    sections:
      - active-members
      - pending-invitations
      - roles

  - id: settings.personalization
    path: /app/settings/personalization
    access: workspace-admin
    rendering: static-shell-islands
    owner: workspaces
    flowIds: [WORKSPACE-003]
    sections:
      - profile-modules
      - gender-options
      - contact-method-types
      - contact-labels
      - activity-types
      - emotion-options
      - life-event-types
      - relationship-types
      - pet-categories
      - reminder-rules
      - tags

  - id: settings.workspace-danger
    path: /app/settings/workspace/danger-zone
    access: workspace-owner
    rendering: static-shell-islands
    owner: workspaces
    flowIds: [WORKSPACE-002]
    sections:
      - reset-workspace-data
      - delete-workspace

  - id: settings.storage
    path: /app/settings/storage
    access: workspace-admin
    rendering: static-shell-islands
    owner: files
    flowIds: [FILES-001]
    sections:
      - usage-and-limits
      - object-state
      - file-lookup

  - id: settings.api-access
    path: /app/settings/api
    access: workspace-admin
    rendering: static-shell-islands
    owner: api-access
    flowIds: [API-001]

  - id: settings.integrations
    path: /app/settings/integrations
    access: workspace-admin
    rendering: static-shell-islands
    owner: integrations
    flowIds: [INTEGRATION-001]

  - id: settings.import
    path: /app/settings/import
    access: data-admin
    rendering: static-shell-islands
    owner: import-export
    flowIds: [IMPORT-001]
    sections:
      - first-import-state
      - import-history

  - id: settings.import-new
    path: /app/settings/import/new
    access: data-admin
    rendering: static-shell-islands
    owner: import-export
    flowIds: [IMPORT-001]
    sections:
      - source-upload
      - format-detection
      - dry-run
      - commit-confirmation

  - id: settings.import-report
    path: /app/settings/import/:importId
    access: data-admin
    rendering: static-shell-islands
    owner: import-export
    flowIds: [IMPORT-001]
    sections:
      - progress
      - summary
      - diagnostics
      - missing-attachments
      - retry-or-rerun

  - id: settings.export
    path: /app/settings/export
    access: data-admin
    rendering: static-shell-islands
    owner: import-export
    flowIds: [EXPORT-001]
    sections:
      - create-export
      - export-history
      - downloads

  - id: settings.audit
    path: /app/settings/audit
    access: audit-read
    rendering: static-shell-islands
    owner: governance
    flowIds: [GOVERNANCE-002]
    sections:
      - filters
      - audit-events

  - id: settings.billing
    path: /app/settings/billing
    access: workspace-owner
    rendering: static-shell-islands
    owner: billing
    availability: optional-module
    flowIds: [BILLING-001]

  - id: compliance.accept
    path: /app/compliance
    access: authenticated
    rendering: on-demand
    owner: governance
    flowIds: [GOVERNANCE-001]
