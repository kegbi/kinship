schemaVersion: 1
decisionStatus: accepted
defaultDeliveryStatus: planned
routeParameterSyntax: colon
sectionDeepLinkParameter: section

renderingStrategies:
  static:
    description: Built without request-specific data.
  static-shell-islands:
    description: Prerendered shell with authenticated data loaded by focused islands.
  # ADR 0007: only a page whose first response must carry request-time data
  # renders on demand; every other page is prerendered.
  on-demand:
    description: Server-rendered per request because its first response carries request-time data.

defaultStates:
  public:
    - ready
    - not-found
  authenticated:
    - loading
    - ready
    - empty
    - error
    - forbidden
    - not-found

# `sharedSurfaces` (GAP-048): surfaces the protected application shell draws
# on every protected page. They have no route of their own, so they carry no
# path and no page ID; each result they offer opens one of the cataloged
# `pages` below. Each names the module that owns it, the read model it reads
# (one declared in `module-boundaries.yaml`), the flows that prove it, its
# `states`, and, for a grouped surface, its `groups` in display order.
sharedSurfaces:
  # GAP-048 (`SEARCH-001`): the header search palette. `recent` is the empty
  # query's recently viewed people, `commands` a `>` query, `searching` a
  # query awaiting its debounced answer, `results` the grouped people, notes,
  # activities, journal posts, and tasks, `empty` a query nothing matches, and
  # `partial` the people answered while the other groups could not in time,
  # and `error` search unavailable. The field accepts at most two hundred
  # characters, and the API refuses a longer query.
  - id: shell.search-palette
    owner: people
    readModel: search
    flowIds: [SEARCH-001, PEOPLE-002]
    states: [
      closed,
      recent,
      commands,
      searching,
      results,
      partial,
      empty,
      error,
    ]
    groups: [people, notes, activities, journal-posts, tasks]

  # GAP-053 (`TODAY-002`): the header notification bell. `loading` is the
  # disabled bell while the session and the first page resolve; `read` shows
  # no badge and `unread` a badge of 1 to 99, or 99+, that the button's
  # accessible name also says. The panel shows `empty` with no notifications,
  # `ready` the newest fifty with unread ones emphasized, `marking` while
  # Mark all read saves the member's read-through watermark, `marked` once it
  # did, and `error` a list it could not read, with Try again. The bell is
  # `hidden` when the session is gone. It is refreshed on every page and once
  # a minute; each notification opens a cataloged page.
  - id: shell.notifications
    owner: planning
    readModel: notifications
    flowIds: [TODAY-002]
    states: [
      loading,
      read,
      unread,
      empty,
      ready,
      marking,
      marked,
      error,
      hidden,
    ]

pages:
  - id: public.home
    path: /
    access: public
    rendering: static
    owner: web
    flowIds: []

  - id: public.features
    path: /features
    access: public
    rendering: static
    owner: web
    flowIds: []

  - id: public.api-reference
    path: /docs/api
    access: public
    rendering: static
    owner: web
    flowIds: [API-002]
    sections: [
      quickstart,
      grants,
      examples,
      conventions,
      errors,
      operations,
      schemas,
    ]

  # MCP-C3: the signed-out guide to the agent endpoint of ADR 0009, generated
  # from `packages/contracts/mcp/tools.json`; flow `API-003` (MCP-C4).
  - id: public.mcp-guide
    path: /docs/mcp
    access: public
    rendering: static
    owner: web
    flowIds: [API-003]
    sections: [overview, connect, grants, behavior, tools]

  - id: legal.privacy
    path: /privacy
    access: public
    rendering: on-demand
    owner: governance
    flowIds: [GOVERNANCE-001]

  - id: legal.terms
    path: /terms
    access: public
    rendering: on-demand
    owner: governance
    flowIds: [GOVERNANCE-001]

  - id: auth.sign-in
    path: /auth/sign-in
    access: anonymous-or-authenticated
    rendering: static-shell-islands
    owner: identity
    flowIds: [AUTH-003]

  - id: auth.sign-up
    path: /auth/sign-up
    access: anonymous
    rendering: static-shell-islands
    owner: identity
    flowIds: [AUTH-001]

  - id: auth.verify-email
    path: /auth/verify-email
    access: anonymous-or-authenticated
    rendering: static-shell-islands
    owner: identity
    flowIds: [AUTH-001]

  - id: auth.recover
    path: /auth/forgot-password
    access: anonymous
    rendering: static-shell-islands
    owner: identity
    flowIds: [AUTH-003]

  - id: auth.reset
    path: /auth/reset-password
    access: anonymous
    rendering: static-shell-islands
    owner: identity
    flowIds: [AUTH-003]

  - id: auth.mfa
    path: /auth/mfa
    access: authentication-challenge
    rendering: static-shell-islands
    owner: identity
    flowIds: [AUTH-003]

  - id: invitation.accept
    path: /invite/:token
    access: anonymous-or-authenticated
    rendering: static-shell-islands
    owner: workspaces
    flowIds: [AUTH-002]

  - id: app.today
    path: /app
    access: active-member
    rendering: static-shell-islands
    owner: web
    readModel: today
    flowIds:
      - TODAY-001
      - TODAY-002
      - PLANNING-001
      - PLANNING-002
      - INTERACTION-001
    sections:
      - attention-queue
      - people-due-for-contact
      - upcoming
      - recently-viewed-people
      - favorite-notes
      - recent-activity
    localActions:
      - quick-capture
      - complete-task
      - open-person
      - open-person-section
      - open-all-tasks

  - id: people.index
    path: /app/people
    access: active-member
    rendering: static-shell-islands
    owner: people
    flowIds: [PEOPLE-002, PEOPLE-007, PEOPLE-008, PEOPLE-009, PEOPLE-010]
    sections:
      - search
      - saved-filters
      - tags
      - tag-facet
      - starred
      - sort
      - active-people
      - duplicates
      - selection
      - bulk-actions
    # GAP-049: the duplicate review. It stays out of the page while `loading`,
    # when there is nothing to review (`empty`), and when it could not be read
    # (`unavailable`); `ready` shows the folded summary, `reviewing` the pairs,
    # `merging` a pair's confirmation, and `stale` a merge refused because one
    # of the pair, or what it would discard, changed; the confirmation then
    # reads the preview again. A name or an email or phone value shared by
    # more than 5 people pairs nobody, so such a crowd never floods the
    # review; any of them can still be merged from their person menu.
    # REL-064: `dismissing` marks a pair as not duplicates for every member,
    # with every pair action busy; `dismissed` drops the pair and says so on
    # the review's status line, which stays in view once no pair is left, and
    # a refused dismissal keeps the pair and says why on that line.
    sectionStates:
      duplicates:
        - loading
        - empty
        - unavailable
        - ready
        - reviewing
        - merging
        - stale
        - dismissing
        - dismissed
      # GAP-051 (PEOPLE-009): a checkbox per row and one for the page shown.
      # `none` shows no bulk bar; `selected` holds 1 to 100 people; `capped`
      # says the 100-person limit refused more. A new search, tag filter,
      # sort, or view clears the selection. Appending pages preserves it.
      selection:
        - none
        - selected
        - capped
      # The sticky bulk bar while anything is selected: `idle` offers Add
      # tag…, Remove tag…, Archive, Delete, Export vCard, and Clear; `choosing-tag`
      # picks a tag from the loaded tag options; `confirming-archive` asks before archiving; `running` is busy
      # and inert; `reported` shows the done, unchanged, and failed counts
      # with each failed person named, and outlives the one refresh after it;
      # `refused` reports a request refused as a whole and keeps the
      # selection.
      bulk-actions:
        - idle
        - choosing-tag
        - confirming-archive
        - confirming-delete
        - running
        - reported
        - refused
      # GAP-053 (PEOPLE-010): the view's most carried tags as chips with
      # their person counts, at most 30. `truncated` adds More tags…, which
      # moves to the tag options search; `selected` is the chip the list is
      # filtered by, pressed, and choosing it again clears the filter.
      tag-facet:
        - loading
        - ready
        - empty
        - unavailable
        - truncated
        - selected
      # Starred only lists starred people; Starred first lists them ahead of
      # everybody else, each group in the chosen order. Starred rows carry a
      # star mark. Both travel in the address.
      starred:
        - all
        - starred-only
        - starred-first
      # Given name, family name, recently added, last contacted (newest call
      # or conversation first, never-contacted people last), and recently
      # updated. A cursor made for another order or filter restarts the list.
      sort:
        - given-name
        - family-name
        - recently-added
        - last-contacted
        - recently-updated

  - id: people.archived
    path: /app/people/archived
    access: active-member
    rendering: static-shell-islands
    owner: people
    flowIds: [PEOPLE-002, PEOPLE-004, PEOPLE-009, PEOPLE-010]
    sections:
      - archived-people
      - tag-facet
      - starred
      - sort
      - selection
      - bulk-actions
    # GAP-051: the same selection and bulk bar as `people.index`, with Restore
    # in place of Archive (without confirmation) and confirmed Delete. An archived person is
    # read-only, so the bar offers no Add tag… or Remove tag… here and has no
    # `choosing-tag` state.
    sectionStates:
      selection:
        - none
        - selected
        - capped
      bulk-actions:
        - idle
        - confirming-delete
        - running
        - reported
        - refused

  - id: people.create
    path: /app/people/new
    access: crm-write
    rendering: static-shell-islands
    owner: people
    flowIds: [PEOPLE-001]

  - id: people.profile
    path: /app/people/:personId
    access: active-member
    rendering: static-shell-islands
    owner: people
    readModel: person-profile
    flowIds:
      - PEOPLE-003
      - PEOPLE-004
      - PEOPLE-005
      - PEOPLE-006
      - PEOPLE-007
      - PEOPLE-008
      - RELATIONSHIP-001
      - INTERACTION-001
      - INTERACTION-002
      - GOVERNANCE-002
      - PLANNING-001
      - PLANNING-002
      - FILES-001
      - GIFTS-001
      - JOURNAL-002
      - PEOPLE-010
      - TODAY-002
    sections:
      - identity-summary
      - important-dates
      - contact-methods
      - addresses
      - relationships
      - first-meeting
      - work
      - food-preferences
      - pets
      - life-events
      - notes
      - conversations
      - calls
      - activities
      - tasks
      - reminders
      - stay-in-touch
      - gifts
      - debts
      - documents
      - photos
      - audit-summary
    localActions:
      - edit-person
      - set-avatar
      - favorite
      - log-activity
      - log-call
      - log-conversation
      - add-note
      - add-life-event
      - add-task
      - add-reminder
      - attach-file
      - export-vcard
      - archive
      - restore
      - merge
      - delete
    # JOURNAL-002: the life-events section's own states beyond the page's
    # authenticated defaults. `read-only` is an archived person's list without
    # controls; `editing`, `saving`, and `validation-error` belong to its one
    # editor, and `stale` is a save or removal refused for an old revision.
    sectionStates:
      # GAP-047: the hero's identity editor. `editing` is the open editor,
      # `saving` a save in flight, `validation-error` a refused field such as
      # an archived gender option, `stale` a save refused for an old revision,
      # and `read-only` an archived person, whose editor does not open.
      identity-summary:
        - ready
        - editing
        - saving
        - validation-error
        - stale
        - read-only
        # GAP-053 (PEOPLE-010): the hero's Star toggle. `starred` and
        # `unstarred` are its pressed states, shared by the whole workspace;
        # `star-saving` shows the new state at once and holds the toggle, and
        # `star-failed` puts the star back with the refusal's words. An
        # archived person's star is `read-only`.
        - starred
        - unstarred
        - star-saving
        - star-failed
      # GAP-047: each section the workspace can turn off has `hidden`. Its
      # card and navigation link are absent, and a `?section=` deep link to it
      # lands on the workspace with the quiet "This section is hidden in this
      # workspace" notice.
      contact-methods: [loading, ready, empty, error, forbidden, hidden]
      addresses: [loading, ready, empty, error, forbidden, hidden]
      relationships: [loading, ready, empty, error, forbidden, hidden]
      first-meeting: [loading, ready, empty, error, forbidden, hidden]
      work: [loading, ready, empty, error, forbidden, hidden]
      food-preferences: [loading, ready, empty, error, forbidden, hidden]
      pets: [loading, ready, empty, error, forbidden, hidden]
      notes: [loading, ready, empty, error, forbidden, hidden]
      conversations: [loading, ready, empty, error, forbidden, hidden]
      calls: [loading, ready, empty, error, forbidden, hidden]
      activities: [loading, ready, empty, error, forbidden, hidden]
      tasks: [loading, ready, empty, error, forbidden, hidden]
      life-events:
        - loading
        - ready
        - empty
        - error
        - forbidden
        - not-found
        - hidden
        - read-only
        - editing
        - saving
        - validation-error
        - stale
    separatePersonPages:
      - people.activity-report
      - people.audit

  - id: people.activity-report
    path: /app/people/:personId/activity-report
    access: active-member
    rendering: static-shell-islands
    owner: interactions
    flowIds: [INTERACTION-001]

  - id: people.audit
    path: /app/people/:personId/audit
    access: audit-read
    rendering: static-shell-islands
    owner: governance
    flowIds: [GOVERNANCE-002]

  - id: tasks.index
    path: /app/tasks
    access: active-member
    rendering: static-shell-islands
    owner: planning
    flowIds: [PLANNING-001]
    sections:
      - open
      - completed
      - cancelled
      - person-filter

  - id: journal.index
    path: /app/journal
    access: active-member
    rendering: static-shell-islands
    owner: journal
    flowIds: [JOURNAL-001]
    sections: [composer, chronological-timeline]
    # Linked activities show live workspace participants and canonical person links.

  - id: journal.item
    path: /app/journal/:journalItemId
    access: active-member
    rendering: static-shell-islands
    owner: journal
    flowIds: [JOURNAL-001]
    sections: [item-detail]
    # Activity detail retains the same participant names and person links as the timeline.

  - id: settings.index
    path: /app/settings
    access: active-member
    rendering: static-shell-islands
    owner: web
    flowIds: [AUTH-004, AUTH-005]
    sections:
      - settings-search
      - personal-settings
      - workspace-settings
      - data-management
      - developer-and-integrations
      - billing-when-enabled

  - id: settings.profile
    path: /app/settings/profile
    access: active-member
    rendering: static-shell-islands
    owner: identity
    flowIds: [AUTH-004, AUTH-005]
    sections:
      - identity
      - self-person-link
      - account-lifecycle

  - id: settings.preferences
    path: /app/settings/preferences
    access: active-member
    rendering: static-shell-islands
    owner: workspaces
    flowIds: [AUTH-004, PLANNING-003, INTEGRATION-002]
    sections:
      - locale-and-time-zone
      - regional-formats
      - reminder-delivery-time
      - calendar-feed
      - display-and-density
    # PLANNING-003: the reminder-delivery controls share the preferences
    # form's states. `unverified-fallback` is the always-visible note that a
    # member without a verified address keeps in-app reminders.
    sectionStates:
      reminder-delivery-time:
        - loading
        - ready
        - error
        - saving
        - saved
        - validation-error
        - unverified-fallback
      # GAP-052: the member's own calendar feed, a personal setting beside
      # reminder delivery. `loading` until its status is read, `unavailable`
      # when it could not be; `none` offers "Create calendar feed", `active`
      # rotation and revocation with its creation and last use, and
      # `link-shown` the one-time subscription link with its warning, after a
      # create or a rotation, until it is dismissed. `busy` holds every feed
      # control while a change runs.
      calendar-feed:
        - loading
        - unavailable
        - none
        - active
        - link-shown
        - busy

  - id: settings.security
    path: /app/settings/security
    access: active-member
    rendering: static-shell-islands
    owner: identity
    flowIds: [AUTH-003, AUTH-004]
    sections:
      - password
      - multi-factor-authentication
      - passkeys
      - recovery-codes
      - sessions

  - id: settings.workspace
    path: /app/settings/workspace
    access: workspace-admin
    rendering: static-shell-islands
    owner: workspaces
    flowIds: [WORKSPACE-001]
    sections:
      - workspace-identity
      - workspace-defaults

  - id: settings.members
    path: /app/settings/members
    access: workspace-admin
    rendering: static-shell-islands
    owner: workspaces
    flowIds: [AUTH-002, WORKSPACE-001, TODAY-002]
    sections:
      - active-members
      - pending-invitations
      - roles

  - id: settings.personalization
    path: /app/settings/personalization
    access: workspace-admin
    rendering: static-shell-islands
    owner: workspaces
    flowIds: [WORKSPACE-003]
    sections:
      - profile-modules
      - gender-options
      - contact-method-types
      - contact-labels
      - activity-types
      - emotion-options
      - life-event-types
      - relationship-types
      - pet-categories
      - reminder-rules
      - tags

  - id: settings.workspace-danger
    path: /app/settings/workspace/danger-zone
    access: workspace-owner
    rendering: static-shell-islands
    owner: workspaces
    flowIds: [WORKSPACE-002]
    sections:
      - reset-workspace-data
      - delete-workspace

  - id: settings.storage
    path: /app/settings/storage
    access: workspace-admin
    rendering: static-shell-islands
    owner: files
    flowIds: [FILES-001]
    sections:
      - usage-and-limits
      - object-state
      - file-lookup

  - id: settings.api-access
    path: /app/settings/api
    access: workspace-admin
    rendering: static-shell-islands
    owner: api-access
    flowIds: [API-001, API-002, API-003]

  - id: settings.integrations
    path: /app/settings/integrations
    access: workspace-admin
    rendering: static-shell-islands
    owner: integrations
    flowIds: [INTEGRATION-001]

  - id: settings.import
    path: /app/settings/import
    access: data-admin
    rendering: static-shell-islands
    owner: import-export
    flowIds: [IMPORT-001, IMPORT-002]
    sections:
      - first-import-state
      - import-history
    # GAP-050: a CSV import still awaiting its column mapping is listed as
    # `awaiting-mapping` and links back to its mapping step.
    sectionStates:
      import-history:
        - loading
        - ready
        - empty
        - error
        - awaiting-mapping

  - id: settings.import-new
    path: /app/settings/import/new
    access: data-admin
    rendering: static-shell-islands
    owner: import-export
    flowIds: [IMPORT-001, IMPORT-002]
    sections:
      - source-choice
      - source-upload
      - format-detection
      - column-mapping
      - dry-run
      - commit-confirmation
    # GAP-050: `source-choice` picks Monica, vCard, or CSV. `format-detection`
    # refuses a file that is not UTF-8 before it is uploaded. `column-mapping`
    # is the CSV step: `preview` shows the header and first five rows with one
    # field choice per column, `applying` a mapping in flight, `refused` a
    # mapping that names nobody, and `resumed` a pending CSV import reopened
    # from `?import=<importId>`.
    sectionStates:
      format-detection:
        - awaiting-file
        - detected
        - invalid-encoding
        - unsupported
        - too-large
      column-mapping:
        - preview
        - applying
        - refused
        - resumed

  - id: settings.import-report
    path: /app/settings/import/:importId
    access: data-admin
    rendering: static-shell-islands
    owner: import-export
    flowIds: [IMPORT-001, IMPORT-002, TODAY-002]
    sections:
      - progress
      - summary
      - diagnostics
      - missing-attachments
      - retry-or-rerun

  - id: settings.export
    path: /app/settings/export
    access: data-admin
    rendering: static-shell-islands
    owner: import-export
    flowIds: [EXPORT-001, EXPORT-002, TODAY-002]
    sections:
      - format-choice
      - create-export
      - export-history
      - downloads
    # GAP-050: `format-choice` picks portable JSON, a CSV archive, or one vCard
    # file, and is locked while an export is being created.
    sectionStates:
      format-choice:
        - ready
        - creating

  - id: settings.audit
    path: /app/settings/audit
    access: audit-read
    rendering: static-shell-islands
    owner: governance
    flowIds: [GOVERNANCE-002]
    sections:
      - filters
      - audit-events

  - id: settings.billing
    path: /app/settings/billing
    access: workspace-owner
    rendering: static-shell-islands
    owner: billing
    availability: optional-module
    flowIds: [BILLING-001]

  - id: compliance.accept
    path: /app/compliance
    access: authenticated
    rendering: static-shell-islands
    owner: governance
    flowIds: [GOVERNANCE-001]
