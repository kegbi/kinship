  # REL-065: `deleted-person-not-recreated` — re-importing a contact whose
  # person is deleted (by a member, or already deleted in the Monica source)
  # leaves them deleted: nothing is created, nothing from the row (avatar
  # included) is written onto them, and the commit counts them as skipped
  # because deleted, not as reused. An archived person is reused. Every later
  # run reports the same.
  - id: IMPORT-001
    title: Import Monica data safely and idempotently
    deliveryStatus: delivered
    priority: P0
    actor: data-admin
    trigger: The administrator uploads a bounded Monica SQL data export or Monica JSON version 1 envelope.
    preconditions: [active-admin-membership]
    steps:
      - Detect and parse the bounded source format into staging.
      - Produce a dry-run report with counts, orphans, unsupported data, and missing files.
      - Choose Create, Map, or Skip for unresolved contact method types; choose each unresolved debt currency individually or apply a bulk currency with overrides, choose each unresolved contact gender or Unspecified, and choose your personal timezone for reminder schedules.
      - Commit only after explicit confirmation and complete server-side validation of every required selection.
      - Re-run the same source without duplicating canonical entities or recreating a person a member deleted.
      - Keep all legacy credentials inactive.
    alternateOutcomes: [
      malformed-source,
      orphaned-reference,
      missing-attachment,
      cancelled-dry-run,
      partial-failure,
      deleted-person-not-recreated,
    ]
    result: The import is atomic, diagnosable, tenant-safe, and idempotent.
