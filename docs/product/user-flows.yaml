schemaVersion: 1
decisionStatus: accepted
defaultDeliveryStatus: planned

testPolicy:
  idAnnotation: flow
  requiredRunner: playwright
  requiredBrowsers: [chromium, firefox, webkit]
  accessibilityOnRepresentativeStates: true
  keyboardOnlyOnPrimaryPaths: true

flows:
  - id: AUTH-001
    title: Create the first workspace
    deliveryStatus: delivered
    priority: P0
    actor: anonymous-person
    trigger: The person chooses to create an account.
    preconditions: [registration-is-available]
    steps:
      - Submit identity and workspace information.
      - Verify the email address when required.
      - Create the owner membership atomically.
      - Enter the authenticated application.
    alternateOutcomes: [
      duplicate-email,
      invalid-or-expired-verification,
      creation-rollback,
    ]
    result: One user, workspace, and active owner membership exist.
    auditEffect: workspace-created
    pageIds: [auth.sign-up, auth.verify-email, app.today]
    moduleIds: [identity, workspaces]
    permissions: [registration.create]
    testLayers: [unit, integration, e2e]
    e2e: { required: true, testRefs: [tests/e2e/registration.AUTH-001.spec.ts] }

  - id: AUTH-002
    title: Invite and add a workspace member
    deliveryStatus: delivered
    priority: P0
    actor: workspace-admin
    trigger: An owner or admin invites another person.
    preconditions: [active-admin-membership]
    steps:
      - Create a single-use invitation.
      - Deliver or expose the invitation link.
      - Authenticate or register the invitee.
      - Accept the invitation into the intended workspace.
    alternateOutcomes: [
      expired-token,
      revoked-token,
      already-a-member,
      wrong-authenticated-user,
    ]
    result: The invitee has one active membership and the invitation cannot be reused.
    auditEffect: workspace-member-joined
    pageIds: [settings.members, invitation.accept]
    moduleIds: [identity, workspaces]
    permissions: [workspace.members.invite]
    testLayers: [unit, integration, e2e]
    e2e: { required: true, testRefs: [tests/e2e/invitations.AUTH-002.spec.ts] }

  - id: AUTH-003
    title: Sign in through password and MFA challenges
    deliveryStatus: delivered
    priority: P0
    actor: registered-person
    trigger: The person submits credentials.
    preconditions: [active-credential]
    steps:
      - Validate the primary credential without revealing account existence.
      - Require the configured second factor.
      - Rotate and persist the authenticated session.
      - Enter the selected active workspace.
    alternateOutcomes: [
      invalid-credential,
      invalid-mfa,
      recovery-code,
      suspended-membership,
      expired-reset,
    ]
    result: A revocable session exists only after all required challenges pass.
    auditEffect: authentication-succeeded-or-failed
    pageIds: [
      auth.sign-in,
      auth.mfa,
      auth.recover,
      auth.reset,
      settings.security,
    ]
    moduleIds: [identity, workspaces]
    permissions: [session.create]
    testLayers: [unit, integration, e2e]
    e2e: {
      required: true,
      testRefs: [
        tests/e2e/sign-in.AUTH-003.spec.ts,
        tests/e2e/shell.TODAY-001.spec.ts,
      ],
    }

  - id: AUTH-004
    title: Manage preferences and sessions
    deliveryStatus: delivered
    priority: P0
    actor: active-member
    trigger: The member changes a preference or revokes a session.
    preconditions: [authenticated-session]
    steps:
      - Load only the current member's preferences and sessions.
      - Save a validated preference or revoke the selected session.
      - Apply the change without affecting another member.
    alternateOutcomes: [
      current-session-revoked,
      stale-session,
      forbidden-session-id,
    ]
    result: Member-owned state changes and revoked credentials stop working.
    auditEffect: member-security-or-preference-updated
    pageIds: [
      settings.index,
      settings.profile,
      settings.preferences,
      settings.security,
    ]
    moduleIds: [identity, workspaces]
    permissions: [member.self.manage]
    testLayers: [unit, integration, e2e]
    e2e: { required: true, testRefs: [tests/e2e/settings.AUTH-004.spec.ts] }

  - id: AUTH-005
    title: Leave a workspace or delete the personal identity safely
    deliveryStatus: delivered
    priority: P1
    actor: active-member
    trigger: The member chooses a personal account lifecycle action.
    preconditions: [authenticated-session, recent-authentication]
    steps:
      - Preview affected memberships, active sessions, and owned workspaces.
      - Require ownership transfer or workspace deletion before removing a last owner.
      - Explain retained legal records separately from CRM data.
      - Require explicit confirmation and execute the selected personal lifecycle action atomically.
      - Revoke affected sessions and redirect to the next valid workspace or signed-out state.
    alternateOutcomes: [
      confirmation-cancelled,
      unresolved-owned-workspace,
      last-owner-removal,
      retention-policy-applies,
      transactional-failure,
    ]
    result: A member can leave or remove their identity without orphaning a workspace or silently retaining access.
    auditEffect: member-left-or-identity-deletion-attempted
    pageIds: [settings.index, settings.profile]
    moduleIds: [governance, identity, workspaces]
    permissions: [member.self.delete]
    testLayers: [unit, integration, e2e]
    e2e: {
      required: true,
      testRefs: [tests/e2e/personal-lifecycle.AUTH-005.spec.ts],
    }

  - id: WORKSPACE-001
    title: Manage workspace settings and members
    deliveryStatus: delivered
    priority: P1
    actor: workspace-admin
    trigger: An administrator changes workspace configuration.
    preconditions: [active-admin-membership]
    steps:
      - Load the current workspace configuration.
      - Apply a role-appropriate validated change.
      - Keep the last owner and tenant boundary protected.
    alternateOutcomes: [
      member-forbidden,
      last-owner-removal,
      cross-workspace-member,
    ]
    result: Only the intended workspace configuration changes.
    auditEffect: workspace-configuration-updated
    pageIds: [settings.workspace, settings.members]
    moduleIds: [workspaces]
    permissions: [workspace.manage]
    testLayers: [unit, integration, e2e]
    e2e: { required: true, testRefs: [tests/e2e/settings.AUTH-004.spec.ts] }

  - id: WORKSPACE-002
    title: Reset or delete a workspace safely
    deliveryStatus: delivered
    priority: P1
    actor: workspace-owner
    trigger: The owner opens the workspace danger zone and chooses a destructive action.
    preconditions: [active-owner-membership, recent-authentication]
    steps:
      - Load impact counts for the active workspace without exposing another workspace.
      - Explain whether the action resets CRM data or deletes the workspace itself.
      - Require typed confirmation and revalidate owner invariants on the server.
      - Execute the selected lifecycle operation atomically or leave all data intact.
      - Revoke or redirect affected sessions and record the result outside deleted data.
    alternateOutcomes: [
      confirmation-cancelled,
      stale-impact-preview,
      last-required-owner-invariant,
      cross-workspace-id,
      transactional-failure,
    ]
    result: Destructive workspace lifecycle changes are explicit, authorized, atomic, and auditable.
    auditEffect: workspace-reset-or-deletion-attempted
    pageIds: [settings.workspace-danger]
    moduleIds: [
      identity,
      workspaces,
      people,
      relationships,
      interactions,
      journal,
      planning,
      files,
      gifts,
      integrations,
      governance,
      operations,
    ]
    permissions: [workspace.reset, workspace.delete]
    testLayers: [unit, integration, schema, e2e]
    e2e: {
      required: true,
      testRefs: [tests/e2e/workspace-lifecycle.WORKSPACE-002.spec.ts],
    }

  - id: WORKSPACE-003
    title: Configure profile modules and controlled vocabularies
    deliveryStatus: delivered
    priority: P1
    actor: workspace-admin
    trigger: An administrator opens a personalization section.
    preconditions: [active-admin-membership]
    steps:
      - Deep-link to one profile-module or vocabulary section.
      - Validate names, ordering, defaults, and workspace ownership.
      - Preview references before replacing, disabling, or deleting an option.
      - Apply the change through the module that owns the affected records.
      - Keep data in disabled profile modules and refresh affected forms and projections.
      - List every switchable person-workspace section, visible until its first change writes its row; turn it off or on, never delete it. Reorder is stored for the settings list; the person workspace keeps its rail order.
      - Give each contact method type a kind (Email, Phone, Website, social, instant messaging, username, or custom, the default), which vCard and CSV imports file values by (GAP-050).
    alternateOutcomes: [
      option-in-use-requires-replacement,
      required-default,
      duplicate-name,
      cross-workspace-option,
      member-forbidden,
      core-section-not-deletable,
    ]
    result: Workspace terminology and profile composition change without deleting person history or bypassing module boundaries.
    auditEffect: workspace-personalization-updated
    pageIds: [settings.personalization]
    moduleIds: [people, planning, workspaces]
    permissions: [workspace.personalization.manage]
    testLayers: [unit, integration, e2e]
    e2e: {
      required: true,
      testRefs: [
        tests/e2e/personalization.WORKSPACE-003.spec.ts,
        tests/e2e/identity.PEOPLE-004.spec.ts,
      ],
    }

  - id: TODAY-001
    title: Review and act on today's relationship priorities
    deliveryStatus: delivered
    priority: P0
    actor: active-member
    trigger: The member enters the authenticated application.
    preconditions: [active-membership, valid-member-timezone]
    steps:
      - Load overdue, today, and next-seven-day attention items for the active workspace.
      - Show due stay-in-touch people with last-interaction context.
      - Complete a task, dismiss an undelivered reminder, or navigate to the owning person section.
      - Refresh only affected projections while preserving the rest of the page.
    # Dismiss acknowledges the reader's own reminder occurrence whose delivery
    # failed or needs manual attention through planning's use case; it becomes
    # `skipped` and is never resent (REL-088).
    alternateOutcomes: [
      first-workspace-onboarding,
      no-due-work,
      secondary-region-error,
      midnight-boundary,
      daylight-saving-transition,
      undelivered-reminder-dismissed,
    ]
    result: The member can identify and advance the most important current relationship work.
    auditEffect: only-the-invoked-owning-use-case
    pageIds: [app.today, people.profile, tasks.index]
    moduleIds: [people, interactions, planning, workspaces]
    permissions: [people.read, tasks.write, reminders.write]
    testLayers: [unit, integration, contract, e2e]
    e2e: {
      required: true,
      testRefs: [
        tests/e2e/today.TODAY-001.spec.ts,
        tests/e2e/shell.TODAY-001.spec.ts,
      ],
    }

  - id: TODAY-002
    title: See and clear notifications
    deliveryStatus: delivered
    priority: P1
    actor: active-member
    trigger: The member opens the notification bell in the application header on any protected page.
    preconditions: [active-membership]
    steps:
      - See the bell's unread badge, refreshed on every page and once a minute, and its accessible name with the unread count (99+ above 99).
      - Open the panel to read their own notifications, newest first - delivered in-app reminders, email reminders that could not be delivered, their finished exports and imports, and accepted invitations they sent - with unread ones emphasized.
      - Follow a notification to where it happened, such as a reminder's person workspace reminders section.
      - Choose Mark all read, which saves the newest shown notification's time as the member's read-through watermark, and see the badge clear.
    alternateOutcomes: [
      empty,
      unread-badge,
      unread-count-bounded-at-99-plus,
      mark-all-read,
      # Read state is one read-through watermark per member in their
      # interface state, not a flag per notification; it only moves forward,
      # so an older tab never marks newer notifications unread again.
      stale-watermark-never-moves-back,
      # The watermark compares each item's own time, not when it was
      # committed: an item timed just before a watermark but committed after
      # it was saved arrives already read.
      item-committed-after-watermark-arrives-read,
      reminder-notification-links-to-person,
      export-ready,
      import-finished,
      invitation-accepted,
      email-reminder-undeliverable,
      # A member never sees another member's reminders, data jobs, or
      # invitations, nor anything from another workspace; finished data jobs
      # show only while the member still holds a role that may run them.
      another-members-items-never-shown,
      cross-workspace-items-never-shown,
      notifications-unavailable-retry,
    ]
    result: The member knows what happened for them since they last looked and can clear it in one action, without a Today card or a per-item read flag.
    auditEffect: none
    pageIds: [
      app.today,
      people.profile,
      settings.export,
      settings.import-report,
      settings.members,
    ]
    moduleIds: [planning, governance, workspaces, people]
    permissions: [workspace.read, member.self.manage]
    testLayers: [unit, integration, e2e]
    e2e: {
      required: true,
      testRefs: [tests/e2e/notifications.TODAY-002.spec.ts],
    }

  - id: PEOPLE-001
    title: Create a person
    deliveryStatus: delivered
    priority: P0
    actor: crm-writer
    trigger: The member chooses to add a person.
    preconditions: [active-membership]
    steps:
      - Enter the minimal known identity data.
      - Preserve unknown and partial values explicitly.
      - Create the workspace-owned person.
      - Open the complete person workspace.
    alternateOutcomes: [
      validation-error,
      possible-duplicate,
      save-and-add-another,
    ]
    result: A new person exists only in the active workspace.
    auditEffect: person-created
    pageIds: [people.create, people.profile]
    moduleIds: [people]
    permissions: [people.write]
    testLayers: [unit, integration, e2e]
    e2e: {
      required: true,
      testRefs: [tests/e2e/people-create.PEOPLE-001.spec.ts],
    }

  - id: PEOPLE-002
    title: Find a person
    deliveryStatus: delivered
    priority: P0
    actor: active-member
    trigger: The member searches, filters, sorts, or browses people.
    preconditions: [active-membership]
    steps:
      - Query only the active workspace.
      - Apply search, tag, archive, and sort criteria.
      - Open the selected person workspace.
    alternateOutcomes: [empty-result, archived-result, not-found, stale-cursor]
    result: Results never reveal another workspace's people.
    auditEffect: none
    pageIds: [people.index, people.archived, people.profile]
    moduleIds: [people]
    permissions: [people.read]
    testLayers: [unit, integration, e2e]
    e2e: {
      required: true,
      testRefs: [
        tests/e2e/people-directory.PEOPLE-002.spec.ts,
        tests/e2e/focus.PRF-002.spec.ts,
      ],
    }

  - id: PEOPLE-003
    title: Read the complete person workspace
    deliveryStatus: delivered
    priority: P0
    actor: active-member
    trigger: The member opens a person.
    preconditions: [person-in-active-workspace]
    steps:
      - Load the identity and due-information summary first.
      - Compose enabled person sections through approved read models.
      - Load heavy sections independently without losing page context.
      - Deep-link and focus a requested section when present.
    alternateOutcomes: [
      archived-read-only,
      partial-person-reconciliation,
      section-error,
      person-not-found,
      hidden-section-deep-link,
    ]
    result: Nearly all person-specific information is available on one canonical route.
    auditEffect: none
    pageIds: [people.profile]
    moduleIds: [
      people,
      relationships,
      interactions,
      journal,
      planning,
      files,
      gifts,
    ]
    permissions: [people.read]
    testLayers: [integration, contract, e2e]
    e2e: {
      required: true,
      testRefs: [
        tests/e2e/person-workspace.PEOPLE-003.spec.ts,
        tests/e2e/person-shell.PEOPLE-003.spec.ts,
        tests/e2e/identity.PEOPLE-004.spec.ts,
      ],
    }

  - id: PEOPLE-004
    title: Edit, archive, restore, or delete a person
    deliveryStatus: delivered
    priority: P0
    actor: crm-writer
    trigger: The member invokes a person lifecycle action.
    preconditions: [person-in-active-workspace]
    steps:
      - Check the action-specific permission and current lifecycle state.
      - Edit every identity state the workspace shows — names, nickname, description, gender from the workspace vocabulary, partial, and deceased — in the one hero editor at the revision it was opened with.
      - On marking the person deceased, open the important dates on the date of death, which is written through their own route.
      - Apply the state transition atomically.
      - Refresh the profile and relevant people list.
    alternateOutcomes: [
      archived-write-rejected,
      delete-confirmation-cancelled,
      cross-workspace-id,
      gender-option-archived,
      deceased-unknown-year,
      deceased-cleared-date-kept,
      stale-revision,
    ]
    result: The lifecycle state is explicit and dependent records follow canonical policy.
    auditEffect: person-updated-archived-restored-or-deleted
    pageIds: [people.profile, people.index, people.archived]
    moduleIds: [people]
    permissions: [people.write, people.delete]
    testLayers: [unit, integration, e2e]
    e2e: {
      required: true,
      testRefs: [
        tests/e2e/person-lifecycle.PEOPLE-004.spec.ts,
        tests/e2e/identity.PEOPLE-004.spec.ts,
      ],
    }

  - id: PEOPLE-005
    title: Record important and partial dates
    deliveryStatus: delivered
    priority: P0
    actor: crm-writer
    trigger: The member records a birthday, first meeting, death, or custom date.
    preconditions: [person-in-active-workspace]
    steps:
      - Select known components and explicit precision.
      - Reject contradictory components.
      - Persist the partial date without invented values.
      - Regenerate associated future reminder state when required.
    alternateOutcomes: [
      unknown-year,
      month-only,
      approximate-year,
      invalid-calendar-date,
      date-of-death-from-identity-editor,
      deceased-cleared-date-kept,
    ]
    result: Display and scheduling preserve the exact stated precision.
    auditEffect: person-date-updated
    pageIds: [people.profile]
    moduleIds: [people, planning, journal]
    permissions: [people.write]
    testLayers: [unit, integration, schema, e2e]
    e2e: {
      required: true,
      testRefs: [
        tests/e2e/important-dates.PEOPLE-005.spec.ts,
        tests/e2e/identity.PEOPLE-004.spec.ts,
      ],
    }

  - id: PEOPLE-006
    title: Maintain person profile facts within enabled sections
    deliveryStatus: delivered
    priority: P1
    actor: crm-writer
    trigger: The member edits contact methods, addresses, work, tags, pets, or other profile facts.
    preconditions: [active-membership]
    steps:
      - Validate the owning workspace vocabulary and target person.
      - Apply the local profile change through its owning use case.
      - Keep a pending or failed save protected as an unsaved draft until acknowledged success or explicit discard.
      - Confirm before replacing a dirty local editor; declining retains its values and focus.
      - Keep mobile fact sheets modal with contained keyboard focus, local scrolling, guarded Escape, explicit Cancel, and focus restored to the opener; preserve drafts across viewport changes.
      - Retry a failed fact read within its block while preserving neighboring values and drafts; stop retrying on access denial.
      - Respect disabled profile modules without treating hidden data as deleted.
      - Refresh only the affected profile section.
    alternateOutcomes: [
      custom-type-disabled,
      hidden-section,
      cross-workspace-link,
      failed-save-retry,
      failed-read-retry,
      declined-draft-navigation,
      declined-editor-switch,
      declined-sheet-dismissal,
    ]
    result: Profile facts remain available from the single person workspace and use current workspace terminology.
    auditEffect: person-profile-fact-updated
    pageIds: [people.profile]
    moduleIds: [people, workspaces]
    permissions: [people.write]
    testLayers: [unit, integration, e2e]
    e2e: {
      required: true,
      testRefs: [tests/e2e/profile-facts.PEOPLE-006.spec.ts],
    }

  - id: PEOPLE-007
    title: Give a person an avatar, replace it, or return to initials
    deliveryStatus: delivered
    priority: P1
    actor: crm-writer
    trigger: The member changes the avatar from the person workspace hero.
    preconditions: [active-membership, person-in-active-workspace]
    steps:
      - Choose a JPEG, PNG, or WebP image of 1 MB or less from the hero's avatar editor.
      - Store it as the files module's avatar upload kind, scanned before it is kept.
      - Link it as the person's avatar through the people facade and discard the image it replaced.
      - Draw the same avatar descriptor in the hero, directory rows, people palette rows, and Quick capture's chosen participants.
      - Serve the image only through the authorized person-file download route.
      - Remove the avatar to return to the person's initials on their colour, also removing any image held for review.
    alternateOutcomes: [
      invalid-type,
      oversized,
      quarantined,
      missing-object,
      archived-read-only,
      cross-workspace-concealed,
    ]
    result: The person is drawn with their image everywhere they appear, or with their initials when there is none or its bytes are missing.
    auditEffect: people-avatar-updated-or-removed
    pageIds: [people.profile, people.index]
    moduleIds: [people, files, workspaces]
    permissions: [people.write, files.write]
    testLayers: [unit, integration, e2e]
    e2e: {
      required: true,
      testRefs: [tests/e2e/avatars.PEOPLE-007.spec.ts],
    }

  # GAP-049: two records of one person become one. The merge runs in one
  # people transaction through a participant per owning module, relinks every
  # row that names the duplicate, checks its postconditions, soft-deletes the
  # duplicate as person delete does, and records `people.person-merged` with
  # per-table counts and a snapshot of every discarded single-valued fact.
  # There is no undo, and the confirmation says so. Rules beyond relinking:
  # - The server refuses a merge that is not confirmed against both people's
  #   current revisions and the preview's `conflictsDigest`, a SHA-256 over
  #   each conflict's fact and kept and discarded values; dates, photos, and
  #   cadences change without moving a revision, so a changed digest answers
  #   409 `merge_conflicts_changed` and the confirmation reads the preview
  #   again before the member confirms.
  # - The duplicate review pairs nobody by a full name, email address, or
  #   phone number more than 5 people share; any of them can still be merged
  #   from the person menu.
  # - Two people who both represent a workspace member are never merged
  #   (409 `merge_both_members`): one member would lose their own record.
  # - An exact copy of a contact method is dropped; a conversation thread
  #   that pointed at the dropped copy keeps its channel type but loses the
  #   link to the method.
  # - `audit_events.person_id` is re-pointed to the survivor, which the schema
  #   already treats as mutable through ON DELETE SET NULL; an event's
  #   action, payload, actor, and time are never changed.
  # - REL-064: a pair that is two different people can be marked "Not
  #   duplicates" instead (`people.write`). The decision is stored once per
  #   workspace in `person_duplicate_dismissals`, lower id first, so the
  #   review stops offering the pair to every member; dismissing it again
  #   changes nothing, a pair across workspaces or with a deleted person is
  #   refused, and `people.duplicate-dismissed` is audited with the two ids
  #   only. There is no undo; a merge carries the duplicate's decisions to
  #   the primary, and a workspace reset or deletion removes them.
  - id: PEOPLE-008
    title: Review possible duplicates and merge two people into one
    deliveryStatus: delivered
    priority: P1
    actor: crm-writer
    trigger: The member reviews the directory's possible duplicates, or chooses Merge from a person's menu.
    preconditions: [active-membership, both-people-active-in-workspace]
    steps:
      - Review possible duplicates on the people directory, paired by the same full name, email address, or phone number within the workspace.
      - Choose the primary record to keep; from a person's menu, first find the other person.
      - Read the merge preview — how many records move, each single-valued fact labelled "Kept … discarded …", and that a merge cannot be undone — then confirm against both revisions it names.
      - Relink every record that names the duplicate to the primary through each owning module in one transaction, keeping the primary's single-valued facts, and delete the duplicate.
      - Land on the primary's person workspace.
    alternateOutcomes: [
      archived-refused,
      cross-workspace-refused,
      stale-revision,
      conflicts-changed,
      self-merge-refused,
      both-members-refused,
      conflicting-single-valued-dates,
      no-undo,
      reimport-stays-idempotent,
      pair-dismissed-as-not-duplicates,
    ]
    result: One person holds everything both records held, the duplicate's page is not found, and a re-import of the same export lands on the primary.
    auditEffect: people-person-merged
    pageIds: [people.index, people.profile]
    moduleIds: [
      people,
      relationships,
      interactions,
      journal,
      planning,
      files,
      gifts,
      integrations,
      governance,
      workspaces,
      import-export,
    ]
    permissions: [people.merge, people.write]
    testLayers: [unit, integration, e2e]
    e2e: {
      required: true,
      testRefs: [tests/e2e/people-merge.PEOPLE-008.spec.ts],
    }

  # GAP-051: bulk directory actions. The member selects up to 100 people on
  # `people.index` or `people.archived` and adds or removes one tag, archives
  # (active view) or restores (archived view) them, or exports their vCards.
  # Each person runs through the single-person use case in its own
  # transaction, with that use case's permission and its normal audit event;
  # there is no separate bulk audit event. Partial success is the ordinary
  # answer: each person is `done`, `unchanged`, `skipped` (not attempted after
  # access was lost part-way), or `failed` with a stable code. Rules:
  # - `partial-failure`: a person archived or deleted elsewhere fails with
  #   `archived_write_rejected` or `not_found` while the rest are changed.
  # - `already-archived-unchanged`: archiving an archived person, restoring an
  #   active one, tagging a tagged one, or untagging an untagged one writes
  #   nothing and is reported `unchanged`.
  # - `selection-cap`: a selection holds at most 100 people and says so; the
  #   API refuses more with 400.
  # - `selection-cleared-on-filter-change`: a new search, tag filter, sort,
  #   page, or view clears the selection.
  # - `cross-workspace-tag-refused`: a tag from another workspace refuses the
  #   whole request with 400 `profile_fact_reference_invalid`; another
  #   workspace's person fails as `not_found`.
  # - `export-skipped-count`: the selection vCard leaves out anybody missing
  #   from the workspace and counts them in `X-Skipped-Count`.
  - id: PEOPLE-009
    title: Act on several people at once
    deliveryStatus: delivered
    priority: P1
    actor: crm-writer
    trigger: The member selects people in the directory and chooses a bulk action.
    preconditions: [active-membership]
    steps:
      - Select people on the directory, one row at a time or the whole visible page, up to 100.
      - Choose an action from the bulk bar - add or remove a tag, archive or restore, or export a vCard.
      - Confirm the action; archiving asks first.
      - Review the results - how many were done, unchanged, and failed, with each failed person named and why - while the directory refreshes once.
    alternateOutcomes: [
      partial-failure,
      selection-cap,
      selection-cleared-on-filter-change,
      already-archived-unchanged,
      cross-workspace-tag-refused,
      export-skipped-count,
    ]
    result: Every selected person in the workspace is tagged, archived, restored, or exported through the single-person use case, and the member sees exactly who was not.
    auditEffect: per-person-archived-restored-profile-fact-updated-or-downloaded
    pageIds: [people.index, people.archived]
    moduleIds: [people, import-export, governance, workspaces]
    permissions: [people.write, people.vcard.export]
    testLayers: [unit, integration, e2e]
    e2e: {
      required: true,
      testRefs: [tests/e2e/people-bulk.PEOPLE-009.spec.ts],
    }

