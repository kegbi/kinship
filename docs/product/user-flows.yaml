    e2e: {
      required: true,
      testRefs: [tests/e2e/monica-import.IMPORT-001.spec.ts],
    }

  # GAP-050: vCard and CSV contacts through the Monica import's staging, report,
  # and commit. `re-import-idempotent` reuses the people an earlier import of
  # the same cards or rows made; `uid-conflict` is a card whose UID an earlier
  # import holds with different content, reported in the dry run and left
  # unchanged; `unknown-properties-skipped` counts and names every property the
  # importer cannot map, photos included, since photos are not imported;
  # `invalid-encoding` refuses anything but UTF-8; `too-large` refuses a file
  # over the staging size or more than 500 cards or rows; `no-name-rows-skipped`
  # skips, with a warning, a card or row with no name, email, or phone; and
  # `missing-contact-type` reports values the workspace has no contact type for,
  # naming the fix (a type whose kind is Email, Phone, or Website), while a
  # custom type named `Email`, `Phone`, or `Website` is used and said so.
  # `deleted-person-not-recreated`, as in IMPORT-001 (REL-065): a person an
  # earlier import made and a member then deleted stays deleted, is neither
  # made again nor reused, gets none of the row's details or note, and is
  # counted as skipped because deleted in the dry run and the commit; an
  # archived person is reused. `credential-column-refused` refuses a CSV with a password,
  # secret, token, key, or session column before anything is stored, and a
  # credential-like vCard property is only counted, never stored.
  - id: IMPORT-002
    title: Import contacts from vCard or CSV
    deliveryStatus: delivered
    priority: P1
    actor: data-admin
    trigger: The administrator uploads a vCard or CSV file of contacts.
    preconditions: [active-admin-membership]
    steps:
      - Choose the vCard or CSV source.
      - Upload a UTF-8 file within the staging limits.
      - Map each CSV column to a field or Ignore, from the header and first rows; the mapping is kept on the resumable import run.
      - Review the dry-run report of contacts, reused and conflicting identities, deleted people that stay deleted, and skipped properties.
      - Commit after explicit confirmation; people, contact methods, addresses, dates, work, and notes are written through their owning modules.
    alternateOutcomes: [
      re-import-idempotent,
      unknown-properties-skipped,
      invalid-encoding,
      too-large,
      no-name-rows-skipped,
      uid-conflict,
      missing-contact-type,
      deleted-person-not-recreated,
      credential-column-refused,
    ]
    result: Contacts from another address book are imported once, diagnosably, and tenant-safely.
    auditEffect: import-started-validated-committed-or-failed
    pageIds: [settings.import, settings.import-new, settings.import-report]
    moduleIds: [import-export, people, interactions, workspaces, planning]
    permissions: [data.import]
    testLayers: [unit, integration, e2e]
    e2e: {
      required: true,
      testRefs: [tests/e2e/contacts-import.IMPORT-002.spec.ts],
    }

