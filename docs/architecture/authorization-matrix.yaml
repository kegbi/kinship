schemaVersion: 1
decisionStatus: accepted

roles:
  owner:
    description: Final workspace authority. At least one active owner must remain.
  admin:
    description: Manages members, configuration, and workspace data but not ownership-only actions.
  member:
    description: Reads and maintains ordinary CRM data in an active workspace.

principalClasses:
  anonymous:
    description: A request that has not completed authentication.
  authenticated-user:
    description: A verified user before or outside active workspace resolution.
  system-worker:
    description: Non-human principal with only the capabilities required by one worker command.

accessAliases:
  authenticated: [owner, admin, member]
  active-member: [owner, admin, member]
  crm-write: [owner, admin, member]
  workspace-admin: [owner, admin]
  data-admin: [owner, admin]
  audit-read: [owner, admin]
  workspace-owner: [owner]

permissions:
  - id: registration.create
    principals: [anonymous]
    scope: new-identity-and-workspace

  - id: session.create
    principals: [anonymous, authenticated-user]
    scope: authentication-challenge

  - id: legal.accept
    principals: [authenticated-user]
    scope: own-legal-acceptance

  - id: member.self.manage
    roles: [owner, admin, member]
    scope: own-user-and-membership

  - id: member.self.delete
    roles: [owner, admin, member]
    scope: own-user-and-membership
    requires: [
      recent-authentication,
      explicit-confirmation,
      no-orphaned-workspace,
    ]

  - id: workspace.read
    roles: [owner, admin, member]
    scope: active-workspace

  - id: workspace.manage
    roles: [owner, admin]
    scope: active-workspace

  - id: workspace.delete
    roles: [owner]
    scope: active-workspace
    requires: [recent-authentication, typed-confirmation]

  - id: workspace.reset
    roles: [owner]
    scope: active-workspace
    requires: [
      recent-authentication,
      typed-confirmation,
      current-impact-preview,
    ]

  - id: workspace.members.invite
    roles: [owner, admin]
    scope: active-workspace

  - id: workspace.members.manage
    roles: [owner, admin]
    scope: active-workspace

  - id: workspace.personalization.manage
    roles: [owner, admin]
    scope: active-workspace

  - id: people.read
    roles: [owner, admin, member]
    scope: active-workspace

  - id: people.write
    roles: [owner, admin, member]
    scope: active-workspace

  - id: people.delete
    roles: [owner, admin, member]
    scope: active-workspace
    requires: [explicit-confirmation]

  # GAP-049: a merge destroys the duplicate as a separate record, so it is
  # granted exactly as a person delete is, behind an explicit confirmation.
  - id: people.merge
    roles: [owner, admin, member]
    scope: active-workspace
    requires: [explicit-confirmation]

  - id: people.vcard.export
    roles: [owner, admin, member]
    scope: active-workspace

  - id: relationships.write
    roles: [owner, admin, member]
    scope: active-workspace

  - id: interactions.write
    roles: [owner, admin, member]
    scope: active-workspace

  - id: journal.write
    roles: [owner, admin, member]
    scope: active-workspace

  - id: tasks.write
    roles: [owner, admin, member]
    scope: active-workspace

  - id: reminders.write
    roles: [owner, admin, member]
    scope: active-workspace

  - id: reminder-delivery.execute
    principals: [system-worker]
    scope: claimed-reminder-occurrences

  - id: files.read
    roles: [owner, admin, member]
    scope: active-workspace

  - id: files.write
    roles: [owner, admin, member]
    scope: active-workspace

  - id: gifts.write
    # Includes settling with optional reason/photo and permanent domain history,
    # reopening and permanently removing debts, audited atomically. Archived
    # people permit paged history reads but remain read-only for mutations.
    roles: [owner, admin, member]
    scope: active-workspace

  # GIFTS-001 recurring debts: members manage a person's rules under
  # gifts.write; the worker only charges the periods that fell due, one open
  # debt per rule and due date, in the rule's own workspace.
  - id: recurring-debts.charge
    principals: [system-worker]
    scope: due-recurring-debt-periods

  - id: data.import
    roles: [owner, admin]
    scope: active-workspace

  - id: data.export
    roles: [owner, admin]
    scope: active-workspace

  - id: audit.read
    roles: [owner, admin]
    scope: active-workspace

  - id: api-tokens.manage
    roles: [owner, admin]
    scope: active-workspace

  - id: integrations.manage
    roles: [owner, admin]
    scope: active-workspace

  # GAP-052 (`INTEGRATION-002`): each member creates, rotates, and revokes only
  # their own calendar feed. The feed itself is read by the holder of its
  # secret, an `api_tokens` row scoped `calendar.read`, with no session.
  - id: calendar-feed.manage
    roles: [owner, admin, member]
    scope: own-calendar-feed-in-active-workspace

  - id: billing.manage
    roles: [owner]
    scope: active-workspace

invariants:
  - A personal API token is bound to one workspace and acts as its issuer's current membership and role. Every token request resolves the token and that membership again; suspending the issuer or their leaving revokes their tokens, a demoted issuer's token keeps working at the new role until it is revoked, and an X-Workspace-Id that disagrees with the token's workspace answers 401.
  - A route accepts a personal token exactly when its route descriptor names the one grant it requires (tokenScope), and its admission reads that grant from the descriptor; the registry refuses a descriptor whose security and tokenScope disagree, and the published documents carry the grant as x-kinship-token-scope. Only the any-token operations, GET /api/v1/me (getTokenContext) and POST /api/v1/mcp (mcp), accept any valid personal token without naming a grant, and both are token-only.
  - Personal token grants are independent. No grant implies another, and a write grant does not include reading. A grant intersects, and never widens, the issuer's current role permissions, workspace and parent boundaries, section visibility, and cursor rules; role rules such as the owner/admin-only vocabulary reads and changes are still decided by the owning use case.
  - The route registry, not this list, enumerates which routes each grant admits. people:read is directory-only and people:profile:read covers minimal identity, profile facts, important dates, life events, and their lookup options; neither reaches the aggregate person reads. interactions:create records notes, activities, calls, and conversations with their capture options and grants no read, edit, or delete of historic content.
  - Two read grants are composite and are labelled so: search:read returns people and matching notes, activities, journal posts, and tasks, and today:read returns every Today region, whatever other grants the token holds.
  - people:delete (permanent person deletion) and people:merge (merging two people) are destructive grants of their own. people:write never permits either, and the token form's presets leave both unticked, as they do the administrative vocabularies:write.
  - An Authorization header commits a request to token admission; a refused bearer, including one without the route's grant, never falls back to, and never resolves, a session cookie.
  - A bearer write needs no Origin, while a cookie write still requires the exact configured public origin. POST /api/v1/mcp never reads a cookie, answers a missing or refused token with 401 and a WWW-Authenticate Bearer challenge, and refuses a present Origin other than the configured public web origin with 403.
  - Retry-safe creates keep the owning use case's requestId replay and conflict rules for a token exactly as for a session (tasks, interactions, reminders, stay-in-touch cadences, people, journal posts, gifts, debts, and recurring debts).
  - Every audit event written by a token-authenticated request names the token as payload.apiTokenId. A cookie-authenticated request names none, and a module payload can neither set nor overwrite it.
  - GET /api/v1/me answers a valid personal token, whatever its grants, with the token's id, name, scopes and expiry and the workspace, member and role it acts as. It never reads a session cookie, still revalidates the token and its membership, and owes the legal guard what any token route owes. A calendar feed secret is never a personal token.
  - An MCP tool call is an in-process request to one token-enabled route carrying the caller's bearer token and no cookie or Origin, so the route makes every authorization decision. The endpoint lists and registers only the tools whose grant the token holds, and holds no authorization rule of its own.
  - These keep session admission and accept no personal token, whatever its grants: registration, sign-in, MFA, sessions, password recovery, and identity; security settings; the member's own profile and preferences; legal acceptance; members and invitations; workspace settings other than the personalization vocabularies; personal and workspace lifecycle, including the danger zone; API token management; calendar feed settings; DAV; imports and exports, vCard exports included; workspace and person audit history; notifications; storage settings; member UI state; the aggregate person reads (getPerson and the person timeline) and recordPersonView; createRelatedPersonRelationship, which would need two grants; avatar writes; and acknowledgeReminderOccurrence.
  - A role is ignored unless the membership is active.
  - A body or route workspace identifier is never authorization evidence.
  - Every aggregate identifier is resolved together with the active workspace.
  - Strict child rows are reachable only through an already authorized aggregate.
  - Cross-workspace links are rejected before persistence even if a foreign key would accept them.
  - An admin cannot remove, demote, or suspend the last active owner.
  - A member manages only their own credentials, factors, recovery codes, and sessions.
  - Personal identity deletion cannot orphan an owned workspace or leave an active session.
  - Workspace reset and deletion revalidate ownership and current impact after confirmation.
  - Secrets are never returned through audit, administrator, import, or export access.
  - Worker permission is capability-specific and does not imply ordinary member access.
  - Optional modules add permissions but cannot broaden a core permission implicitly.
