services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  api:
    environment:
      APP_ENV: development
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-kinship}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-attachments}
      OBJECT_STORAGE_HOST: object-store
      OBJECT_STORAGE_PORT: "9000"
      OBJECT_STORAGE_REQUEST_TIMEOUT_MS: ${OBJECT_STORAGE_REQUEST_TIMEOUT_MS:-30000}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-kinship-local-secret}
      OBJECT_STORAGE_USE_SSL: "false"
      PUBLIC_WEB_ORIGIN: http://127.0.0.1:${WEB_PORT:-4321}
    depends_on:
      mailpit:
        condition: service_healthy
      object-store:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
  worker:
    environment:
      APP_ENV: development
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-kinship}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-attachments}
      OBJECT_STORAGE_HOST: object-store
      OBJECT_STORAGE_PORT: "9000"
      OBJECT_STORAGE_REQUEST_TIMEOUT_MS: ${OBJECT_STORAGE_REQUEST_TIMEOUT_MS:-30000}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-kinship-local-secret}
      OBJECT_STORAGE_USE_SSL: "false"
    depends_on:
      object-store:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "100"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp:size=32m
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
  object-store:
    image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-kinship}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-kinship-local-secret}
    volumes:
      - object-store-data:/data
    healthcheck:
      test: [
        "CMD",
        "curl",
        "--fail",
        "--silent",
        "http://127.0.0.1:9000/health",
      ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001"

volumes:
  object-store-data:
