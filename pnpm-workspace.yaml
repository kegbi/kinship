packages: []
lockfile: true
sharedWorkspaceLockfile: true
gitBranchLockfile: false
saveExact: true
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # Approved 2026-10-04 security fix; remove after 2026-10-07 02:56:05 UTC.
  - http-cache-semantics@4.3.0
trustLockfile: false
autoInstallPeers: false
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds:
  esbuild@0.28.2: true
  fsevents@2.3.2: false
  fsevents@2.3.3: false
  # Lefthook's postinstall runs `lefthook install`, which writes .git/hooks.
  # Installing the hooks stays an explicit developer action.
  lefthook@2.1.12: false
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - x64
    - arm64
