packages: []
lockfile: true
sharedWorkspaceLockfile: true
gitBranchLockfile: false
saveExact: true
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # Approved 2026-10-04 security fix; remove after 2026-10-07 02:56:05 UTC.
  - http-cache-semantics@4.3.0
trustLockfile: false
autoInstallPeers: false
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds:
  fsevents@2.3.2: false
  fsevents@2.3.3: false
  # Lefthook's postinstall runs `lefthook install`, which writes .git/hooks.
  # Installing the hooks stays an explicit developer action.
  lefthook@2.1.12: false
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - x64
    - arm64
overrides:
  # ajv@8.20.0 asks for fast-uri ^3.0.1 and is shared as a peer of
  # @hookform/resolvers, so `pnpm update` keeps the locked 3.1.7, which carries
  # GHSA-w74x-v6f9-j3xg and four further advisories. 3.1.9 is the fixed release
  # of the same major line; remove this entry once ajv resolves it unaided.
  fast-uri@3: 3.1.9
