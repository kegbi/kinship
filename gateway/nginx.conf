worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # Empty in base/dev/test; deployment may mount one reviewed proxy identity.
  include /etc/nginx/trusted-proxy.d/*.conf;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $uri $kinship_route_template {
    default "static-or-unmatched";
    "/" "/";
    "/gateway-health" "/gateway-health";
    "/auth/verify-email" "/auth/verify-email";
    "/auth/reset-password" "/auth/reset-password";
    "/auth/mfa" "/auth/mfa";
    "/app/compliance" "/app/compliance";
    ~^/invite/[^/]+$ "/invite/:token";
    ~^/api/v1/ "/api/v1/*";
    "~^/app/people/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/?$" "/app/people/:personId";
    ~^/_astro/ "/_astro/:asset";
  }
  # GAP-040: only the credential endpoints (sign-in, MFA, registration and
  # email verification, password reset, invitation acceptance) count against
  # the stricter zone; every other request has an empty key, which nginx
  # does not account.
  map $uri $kinship_credential_client {
    default "";
    ~^/api/v1/(sessions|mfa-challenges|password-reset-requests|password-resets|registrations|email-verifications|email-verification-deliveries|workspace-invitations/(accept|authenticate|inspect|mfa|register|verification-delivery))$ $binary_remote_addr;
  }
  # REL-068: a calendar feed's path is its credential, so a leaked URL is
  # limited per feed as well as per address. The key is the feed id before
  # the secret, so nginx's shared memory never holds a secret; every other
  # path, a malformed feed name included, has an empty key and is not
  # accounted.
  map $uri $kinship_calendar_feed_credential {
    default "";
    "~^/api/v1/calendar-feeds/(kin_cal_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})\." $1;
  }
  map $status $kinship_readiness_state {
    volatile;
    ~^2 "ready";
    default "unavailable";
  }
  log_format kinship_gateway escape=json
    '{"event":"gateway.request","method":"$request_method",'
    '"route":"$kinship_route_template","status":$status,'
    '"duration_seconds":$request_time,"bytes_sent":$body_bytes_sent,"request_id":"$request_id"}';
  log_format kinship_gateway_readiness_api escape=json
    '{"event":"gateway.readiness",'
    '"boundary":"api",'
    '"state":"$kinship_readiness_state","status":$status,'
    '"dependency_status":"$upstream_status"}';
  log_format kinship_gateway_readiness_web escape=json
    '{"event":"gateway.readiness",'
    '"boundary":"web",'
    '"state":"$kinship_readiness_state","status":$status,'
    '"dependency_status":"$upstream_status"}';
  access_log /dev/stdout kinship_gateway;
  log_subrequest on;
  # Nginx's built-in error format contains the raw request URI. Request
  # failures remain observable through the structured status event above;
  # only process-critical diagnostics use the unstructured error channel.
  error_log /dev/stderr crit;
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  sendfile on;
  # Only static locations opt in. Private API and renderer responses retain
  # nginx's uncompressed default; public assets also compress behind the edge.
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript;
  gzip_vary on;
  gzip_proxied any;
  resolver 127.0.0.11 valid=10s ipv6=off;
  # GAP-040: per-client-address limits on the API. The API zone bounds a
  # flood; the credential zone bounds password, code, and token guessing
  # before the API's own per-subject throttles. Both refuse past their burst
  # at once (nodelay) rather than queueing, with the API's problem shape.
  limit_req_zone $binary_remote_addr zone=kinship_api:10m rate=50r/s;
  limit_req_zone $kinship_credential_client zone=kinship_credentials:10m rate=300r/m;
  # REL-068: calendar applications poll a feed every few minutes.
  limit_req_zone $kinship_calendar_feed_credential zone=kinship_calendar_feeds:10m rate=12r/m;
  limit_conn_zone $binary_remote_addr zone=kinship_connections:10m;
  limit_req_status 429;
  limit_conn_status 429;

  server {
    listen 8080;
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/secrets/gateway_tls_certificate;
    ssl_certificate_key /run/secrets/gateway_tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # GAP-040: Mozilla's intermediate profile without its DHE suites. TLS 1.2
    # offers only forward-secret ECDHE with AES-GCM or ChaCha20-Poly1305
    # (TLS 1.3 suites are all AEAD already); every offered suite is strong,
    # so the client picks what suits its hardware.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kinship_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/security_headers.conf;
    root /usr/share/nginx/html;
    index index.html;
    # These aliases exist only on Kinship's private Compose network. Generic
    # api/web names can belong to other applications on a shared edge network.
    set $api_upstream http://kinship-private-api:8000;
    set $web_upstream http://kinship-private-web:4321;
    error_page 404 /404.html;

    location = /gateway-health {
      access_log /dev/stdout kinship_gateway_readiness_api;
      auth_request /_gateway_web_readiness;
      proxy_pass $api_upstream/api/v1/health;
      proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 3s;
      proxy_send_timeout 3s;
      proxy_intercept_errors on;
      error_page 401 403 404 500 502 503 504 = @gateway_unavailable;
    }

    location = /_gateway_web_readiness {
      internal;
      access_log /dev/stdout kinship_gateway_readiness_web;
      proxy_pass $web_upstream/auth/mfa;
      proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 3s;
      proxy_send_timeout 3s;
    }

    location @gateway_unavailable {
      access_log /dev/stdout kinship_gateway_readiness_api;
      default_type text/plain;
      return 503 "Gateway dependencies unavailable\n";
    }

    location /api/v1/ {
      limit_req zone=kinship_api burst=200 nodelay;
      limit_req zone=kinship_credentials burst=100 nodelay;
      limit_conn kinship_connections 64;
      # Only the gateway's own refusals: the API's 429 problems pass through
      # untouched because this location does not intercept upstream errors.
      error_page 429 = @rate_limited;
      client_max_body_size 1501024;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Kinship-Client-Address $remote_addr;
      # The gateway's own identifier replaces anything a client sent, so the
      # API, its log line, and its audit rows correlate with this access log.
      proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    # REL-068: the API location's proxying, with the feed credential zone in
    # place of the credential zone, whose key is empty on every feed path.
    location ^~ /api/v1/calendar-feeds/ {
      limit_req zone=kinship_api burst=200 nodelay;
      limit_req zone=kinship_calendar_feeds burst=6 nodelay;
      limit_conn kinship_connections 64;
      error_page 429 = @rate_limited;
      client_max_body_size 1501024;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Kinship-Client-Address $remote_addr;
      proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    location = /auth/verify-email {
      include /etc/nginx/security_headers.conf;
      proxy_pass $web_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-Id $request_id;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "private, no-store" always;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      proxy_intercept_errors on;
      error_page 502 503 504 = @renderer_unavailable;
    }

    location = /auth/reset-password {
      include /etc/nginx/security_headers.conf;
      proxy_pass $web_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-Id $request_id;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "private, no-store" always;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      proxy_intercept_errors on;
      error_page 502 503 504 = @renderer_unavailable;
    }

    location = /auth/mfa {
      include /etc/nginx/security_headers.conf;
      proxy_pass $web_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-Id $request_id;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "private, no-store" always;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      proxy_intercept_errors on;
      error_page 502 503 504 = @renderer_unavailable;
    }

    location ~ ^/invite/[^/]+$ {
      include /etc/nginx/security_headers.conf;
      proxy_pass $web_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-Id $request_id;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "private, no-store" always;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      proxy_intercept_errors on;
      error_page 502 503 504 = @renderer_unavailable;
    }

    location = /app/compliance {
      include /etc/nginx/security_headers.conf;
      proxy_pass $web_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-Id $request_id;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "private, no-store" always;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      proxy_intercept_errors on;
      error_page 502 503 504 = @renderer_unavailable;
    }

    location @rate_limited {
      include /etc/nginx/security_headers.conf;
      default_type application/problem+json;
      add_header Cache-Control "no-store" always;
      add_header Retry-After "1" always;
      return 429 '{"type":"https://kinship.test/problems/request_rate_limited","title":"Too many requests","status":429,"detail":"Too many requests from this address. Wait a moment and try again.","code":"request_rate_limited"}';
    }

    location @renderer_unavailable {
      default_type text/plain;
      return 503 "Renderer temporarily unavailable\n";
    }

    location /_astro/ {
      gzip on;
      include /etc/nginx/security_headers.conf;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /internal/person-profile-shell {
      return 404;
    }

    location ^~ /internal/person-profile-shell/ {
      return 404;
    }

    location = /internal/activity-report-shell {
      return 404;
    }

    location ^~ /internal/activity-report-shell/ {
      return 404;
    }

    location = /internal/person-audit-shell {
      return 404;
    }

    location ^~ /internal/person-audit-shell/ {
      return 404;
    }

    location = /internal/journal-item-shell {
      return 404;
    }

    location = /internal/import-report-shell {
      return 404;
    }

    location ^~ /internal/import-report-shell/ {
      return 404;
    }

    location ~ "^/app/settings/import/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/?$" {
      gzip on;
      try_files /internal/import-report-shell/index.html =404;
    }

    location ^~ /internal/journal-item-shell/ {
      return 404;
    }

    location ~ "^/app/journal/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/?$" {
      gzip on;
      try_files /internal/journal-item-shell/index.html =404;
    }

    location ~ "^/app/people/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/audit/?$" {
      gzip on;
      try_files /internal/person-audit-shell/index.html =404;
    }

    location ~ "^/app/people/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/activity-report/?$" {
      gzip on;
      try_files /internal/activity-report-shell/index.html =404;
    }

    location ~ "^/app/people/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/?$" {
      gzip on;
      try_files /internal/person-profile-shell/index.html =404;
    }

    location / {
      gzip on;
      try_files $uri $uri/index.html $uri.html =404;
    }
  }
}
