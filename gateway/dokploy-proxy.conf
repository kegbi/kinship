# AUD-G4: a template, not a literal address. The gateway image carries it at
# /etc/nginx/trusted-proxy-templates/dokploy.conf.template; only
# compose.dokploy.yaml points the nginx entrypoint at it, which writes the
# rendered include into a private tmpfs. GATEWAY_TRUSTED_PROXY comes from the
# deployment's runtime.env, has no default, and the Dokploy preflight refuses
# anything but one exact IPv4 or IPv6 address of the edge proxy.
set_real_ip_from ${GATEWAY_TRUSTED_PROXY};
real_ip_header X-Forwarded-For;
real_ip_recursive on;
