# Local support services shared by the development and test overlays: each
# overlay's `mailpit` and `object-store` `extends:` the entry here and adds only
# what differs (published ports, object storage). Production-like `compose.yaml`
# never loads it: a private deployment supplies its own SMTP relay and
# S3-compatible store.
services:
  mailpit:
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "100"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 64
  object-store:
    image: rustfs/rustfs:1.0.7@sha256:69bd3c4d8d79b74723bfd68c9fbd9085155d4d4b44a5a136d87502f3075cc68c
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-kinship}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-kinship-local-secret}
    healthcheck:
      test: [
        "CMD",
        "curl",
        "--fail",
        "--silent",
        "http://127.0.0.1:9000/health",
      ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 10s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 512
